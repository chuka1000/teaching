<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shuffling The Gene Pool: Pairs</title>
<style>
  :root {
    --forest: #1F3D2B; --amber: #DE9A4C; --amberink: #A8651F; --teal: #3E93A3; --rust: #C1442D; --cream: #F5F1E6; --cream2: #E8E0CC;
    --ink: #182B1E; --soft: #52685A; --green: #1F7A48; --white: #fff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--cream); color: var(--ink); font-family: Arial, Helvetica, sans-serif; -webkit-text-size-adjust: 100%; }
  body { min-height: 100vh; display: flex; justify-content: center; }
  #app { width: 100%; max-width: 820px; padding: 14px 16px 28px; }
  h1, h2 { font-family: Georgia, 'Times New Roman', serif; color: var(--forest); margin: 0; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .pill { background: var(--forest); color: var(--white); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; border-radius: 999px; padding: 7px 14px; white-space: nowrap; }
  .pill.hard { background: var(--rust); }
  .dots { display: flex; gap: 6px; }
  .dot { width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--forest); background: var(--white); }
  .dot.now { background: var(--cream2); } .dot.right { background: var(--green); border-color: var(--green); } .dot.wrong { background: var(--rust); border-color: var(--rust); }
  .card { background: var(--white); border: 2px solid var(--cream2); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .ask { font-size: 19px; color: var(--forest); font-weight: 700; margin: 0 0 12px; line-height: 1.35; }
  .ask small { display: block; font-size: 15px; font-weight: 400; color: var(--soft); margin-top: 6px; }
  .sub { font-size: 15px; color: var(--soft); margin: 8px 0 0; line-height: 1.4; }
  /* rock layers */
  table.chart { border-collapse: collapse; margin: 6px 0; font-size: 14px; width: 100%; }
  .chartwrap { overflow-x: auto; max-width: 100%; }
  table.chart th, table.chart td { border: 1px solid #6F5F4B; padding: 4px 3px; text-align: center; min-width: 26px; }
  table.chart th { background: var(--cream2); font-size: 13px; }
  table.chart td.on { background: var(--amber); } table.chart td.off { background: var(--white); }
  table.chart td.name { text-align: left; white-space: nowrap; font-weight: 700; }
  #answer { height: 64px; border: 3px solid var(--forest); border-radius: 12px; background: var(--white); font-size: 34px; font-weight: 700; color: var(--forest); display: flex; align-items: center; padding: 0 16px; margin-bottom: 12px; font-family: Georgia, serif; }
  #answer.empty { color: #9AA59D; font-weight: 400; font-size: 20px; font-family: Arial, sans-serif; }
  .unit { font-size: 15px; color: var(--soft); margin: -6px 0 10px; }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  button { font: inherit; cursor: pointer; }
  .key { height: 58px; font-size: 28px; font-weight: 700; color: var(--forest); background: var(--white); border: 2px solid var(--cream2); border-radius: 12px; touch-action: manipulation; }
  .key:active { background: var(--cream2); } .key.fn { background: var(--cream); font-size: 22px; }
  .key.go, .btn { background: var(--forest); color: var(--white); border: 2px solid var(--forest); }
  .key.go { font-size: 20px; grid-column: 1 / -1; }
  .btn { padding: 15px 26px; border-radius: 12px; font-size: 18px; font-weight: 700; min-height: 54px; touch-action: manipulation; }
  .btn.ghost { background: var(--white); color: var(--forest); } .btn.small { padding: 8px 14px; font-size: 14px; min-height: 44px; }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, summary:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
  .opts { display: grid; gap: 10px; margin-bottom: 12px; }
  .opt { display: flex; align-items: center; gap: 12px; text-align: left; min-height: 58px; padding: 8px 14px; background: var(--white); border: 2px solid var(--cream2); border-radius: 12px; font-size: 17px; font-weight: 700; color: var(--forest); touch-action: manipulation; line-height: 1.3; }
  .opt b { width: 32px; height: 32px; border-radius: 50%; background: var(--cream2); display: flex; align-items: center; justify-content: center; font-size: 16px; flex: none; }
  .opt.correct { border-color: var(--green); background: #EAF6EF; } .opt.picked { border-color: var(--rust); background: #FBEAE6; }
  #feedback { border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; border: 3px solid; }
  #feedback.right { border-color: var(--green); background: #EAF6EF; } #feedback.wrong { border-color: var(--rust); background: #FBEAE6; }
  #feedback .head { font-size: 21px; font-weight: 700; margin-bottom: 6px; } #feedback.right .head { color: var(--green); } #feedback.wrong .head { color: var(--rust); }
  #feedback .msg { font-size: 17px; font-weight: 700; color: var(--forest); margin-bottom: 8px; }
  .how { font-size: 15px; color: var(--soft); margin: 6px 0 2px; }
  .work { font-size: 17px; color: var(--forest); font-weight: 700; line-height: 1.5; } .work div { margin: 2px 0; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--cream2); }
  .row:last-child { border-bottom: 0; }
  .bar { height: 12px; border-radius: 6px; background: var(--cream2); overflow: hidden; width: 140px; flex: none; } .bar i { display: block; height: 100%; background: var(--green); }
  .lead { font-size: 18px; line-height: 1.45; } .small { font-size: 13px; color: var(--soft); }
  .score { font-size: 44px; font-family: Georgia, serif; font-weight: 700; color: var(--forest); }
  ul.tips { padding-left: 20px; margin: 8px 0 0; } ul.tips li { margin: 8px 0; font-size: 17px; line-height: 1.4; }
  .code { font-family: 'Courier New', monospace; font-weight: 700; letter-spacing: .12em; color: var(--forest); }
  details.review { border: 2px solid var(--cream2); border-radius: 12px; background: var(--white); margin: 10px 0 0; }
  details.review > summary { cursor: pointer; padding: 12px 14px; font-weight: 700; color: var(--forest); font-size: 16px; line-height: 1.35; list-style: none; display: flex; justify-content: space-between; gap: 10px; align-items: center; min-height: 48px; }
  details.review > summary::-webkit-details-marker { display: none; } details.review > summary::after { content: '▾'; font-size: 18px; flex: none; }
  details.review[open] > summary::after { transform: rotate(180deg); }
  .rq { padding: 12px 14px; border-top: 1px solid var(--cream2); }
  .rq .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .rq .qn { font-weight: 700; color: var(--forest); font-size: 15px; } .rq .meta { font-size: 14px; color: var(--soft); white-space: nowrap; }
  .rq .verdict { font-weight: 700; font-size: 15px; } .verdict.ok { color: var(--green); } .verdict.no { color: var(--rust); } .verdict.na { color: var(--soft); }
  .rq .txt { font-size: 15px; line-height: 1.4; margin: 4px 0; } .rq .wrote { font-size: 15px; margin: 6px 0 2px; color: var(--forest); }
  .hide { display: none !important; }
  .treefig { margin: 6px 0 10px; } .treefig svg { width: 100%; max-width: 360px; height: auto; display: block; }
  .treefig text { font-family: Arial, Helvetica, sans-serif; fill: #182B1E; } .treefig .leaf { font-weight: 700; font-size: 16px; } .treefig .len { font-size: 13px; fill: #A8651F; font-weight: 700; }
  .treefig line { stroke: #1F3D2B; stroke-width: 2.5; stroke-linecap: round; }
  table.chart td.num { min-width: 34px; } table.chart td.blank { background: var(--cream2); }
  caption { caption-side: bottom; font-size: 13px; color: var(--soft); padding-top: 4px; text-align: left; }

  .scenwrap { margin: 0 0 10px; }
  .scen { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; min-height: 64px; padding: 12px 14px; background: var(--white); border: 2px solid var(--cream2); border-radius: 12px; font-size: 17px; line-height: 1.4; color: var(--ink); touch-action: manipulation; }
  .scen b { width: 30px; height: 30px; border-radius: 50%; background: var(--cream2); display: flex; align-items: center; justify-content: center; font-size: 15px; flex: none; color: var(--forest); }
  .scen.sel { border-color: var(--amber); background: #FBF6E8; } .scen.sel b { background: var(--amber); }
  .scen.right { border-color: var(--green); background: #EAF6EF; } .scen.wrong { border-color: var(--rust); background: #FBEAE6; }
  .scen .chip { display: block; margin-top: 6px; font-size: 14px; font-weight: 700; color: var(--forest); }
  .fb { border-left: 5px solid; margin: 4px 0 0 8px; padding: 8px 12px; font-size: 16px; line-height: 1.4; border-radius: 0 10px 10px 0; background: var(--white); }
  .fb.right { border-color: var(--green); } .fb.wrong { border-color: var(--rust); } .fb b { color: var(--forest); }
  .forces { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 12px 0; }
  @media (min-width: 640px) { .forces { grid-template-columns: repeat(4, 1fr); } }
  .force { display: flex; align-items: center; gap: 10px; min-height: 58px; padding: 8px 12px; background: var(--forest); color: var(--white); border: 2px solid var(--forest); border-radius: 12px; font-weight: 700; font-size: 16px; text-align: left; touch-action: manipulation; }
  .force b { width: 28px; height: 28px; border-radius: 50%; background: var(--amber); color: var(--forest); display: flex; align-items: center; justify-content: center; font-size: 14px; flex: none; }
  .force:disabled { opacity: .45; }
  .hint { font-size: 15px; color: var(--soft); margin: 0 0 8px; min-height: 22px; }
  .dots .dot { width: 11px; height: 11px; }
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<script>
(function () {
  'use strict';

  /* ================================================================== *
   * PAIRS (Shuffling The Gene Pool). Match each scenario to its force.
   * Nobody gets the same game.
   *
   * The four forces: mutation, gene flow, natural selection, genetic drift. A game is
   * three rounds of three boards, and a board is four scenarios to match against the
   * four forces. Everything is generated from a six-character game code that is random
   * for each student; #CODE on the end of the address gives the same game again, so a
   * teacher can see exactly what a student saw. What varies: which wordings are drawn
   * from a bigger set, the animals, the numbers and the colours, which scenarios share
   * a board, and the order of the force buttons. The SKILLS and their order are the
   * same for everyone: every round has exactly three scenarios of each force, so the
   * diagnostic at the end means the same thing for every student.
   *
   * EVERY SCENARIO HAS EXACTLY ONE RIGHT FORCE BY CONSTRUCTION. Each is built around one
   * deciding fact: a new allele appeared (mutation); alleles moved between populations
   * (gene flow); the trait decided who survived and had young (natural selection); or
   * chance decided, with no trait involved (genetic drift). build/check-shuffling-the-gene-pool-game.py
   * re-derives the force of every scenario from that fact, independently.
   *
   * DIFFICULTY RAMPS, AND THE END IS MEANT TO BE HARD. Round 1 names the cue. Round 2
   * describes what happened and leaves the force unnamed. Round 3 goes far past the
   * lesson: the obvious cue is WRONG (a bird eats the first moths it finds, but not by
   * colour; chance blows seeds into a cold valley, but only the frost-resistant live), and
   * the last board is the hardest of all. Some scenarios are made up.
   * ================================================================== */
  var ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  function newCode() {
    var out = '', bytes = new Uint8Array(6);
    if (window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(bytes);
    else for (var k = 0; k < 6; k++) bytes[k] = Math.floor(Math.random() * 256);
    for (var i = 0; i < 6; i++) out += ALPHABET[bytes[i] % ALPHABET.length];
    return out;
  }
  function validCode(c) { return typeof c === 'string' && /^[A-HJ-NP-Z2-9]{6}$/.test(c); }
  function makeRng(code) {
    var h = 1779033703 ^ code.length;
    for (var i = 0; i < code.length; i++) { h = Math.imul(h ^ code.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
    var a = (h ^ (h >>> 16)) >>> 0;
    return function () { a = (a + 0x6D2B79F5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  var FORCES = ['mutation', 'geneflow', 'selection', 'drift'];
  var FNAME = { mutation: 'Mutation', geneflow: 'Gene flow', selection: 'Natural selection', drift: 'Genetic drift' };
  var BY_ATTR = { 'new': 'mutation', 'move': 'geneflow', 'trait': 'selection', 'chance': 'drift' };
  var WHY = {
    mutation: 'A NEW allele appeared, by a copying mistake in the DNA. That is mutation.',
    geneflow: 'Alleles moved between populations, because animals (or pollen) moved and bred. That is gene flow.',
    selection: 'The trait decided who survived and had young, so it is not random. That is natural selection.',
    drift: 'Chance decided, and no allele helped or harmed. That is genetic drift.'
  };
  var ANIMALS = ['beetles', 'mice', 'snails', 'lizards', 'frogs', 'finches', 'moths', 'voles'];
  var TRAITS = ['a long tail', 'thick skin', 'a darker colour', 'a larger size'];
  var COLOURS = [['green', 'brown'], ['pale', 'dark'], ['striped', 'plain'], ['grey', 'yellow']];

  /* the scenarios. attr: the ONE deciding fact. top: the hardest, used on the last board of round 3. */
  var T = [
    /* ---- round 1: the cue is named ---- */
    { id: 'm1a', t: 1, attr: 'new', text: 'A copying mistake in the DNA of one of the {A} makes a brand new allele for {X}. It has never been in the population before.' },
    { id: 'm1b', t: 1, attr: 'new', text: 'One of the {A} is born with an allele for {X} that neither of its parents had. It came from a mistake when the DNA was copied.' },
    { id: 'm1c', t: 1, attr: 'new', text: 'A mutation in one egg gives a {A1} a new allele for {X}. No other {A} in the population has it.' },
    { id: 'm1d', t: 1, attr: 'new', text: 'A mistake when DNA is copied creates a new allele for {X} in one of the {A}. Nothing has arrived from anywhere else.' },
    { id: 'g1a', t: 1, attr: 'move', text: '{N} {A} from the mainland swim to an island and breed with the island {A}, bringing their alleles for {X} with them.' },
    { id: 'g1b', t: 1, attr: 'move', text: 'Wind carries pollen from one field of flowers to another field, and the pollen brings alleles for red petals.' },
    { id: 'g1c', t: 1, attr: 'move', text: 'A group of {A} moves from one valley to another and breeds with the {A} there, so alleles pass between the two populations.' },
    { id: 'g1d', t: 1, attr: 'move', text: '{N} {A} are carried to a new island by a storm and breed with the {A} already there. Their alleles are now in the island population.' },
    { id: 's1a', t: 1, attr: 'trait', text: 'Birds eat {A} that are easy to see. {C1} {A} are harder to see, so more of them survive and have young.' },
    { id: 's1b', t: 1, attr: 'trait', text: 'In a drought, {A} with an allele for {X} survive better than the others. They have more young, so the allele becomes more common.' },
    { id: 's1c', t: 1, attr: 'trait', text: 'Hawks catch the slow {A} more often than the fast ones, so the fast {A} have more young and the allele for speed becomes more common.' },
    { id: 's1d', t: 1, attr: 'trait', text: 'A cold winter kills {A} with thin fur more often than {A} with thick fur. The thick-fur allele is passed on more.' },
    { id: 'd1a', t: 1, attr: 'chance', text: 'A storm kills most of a tiny group of {A}. It kills them by chance, and the colour of an animal makes no difference. The survivors happen to carry mostly the {C1} allele.' },
    { id: 'd1b', t: 1, attr: 'chance', text: 'In a group of only {N} {A}, a few happen to have more young than the others, by luck. No allele helps or harms them.' },
    { id: 'd1c', t: 1, attr: 'chance', text: 'A rockfall crushes {N} of the {A} in a small group. It does not choose by colour or by any other trait: it is chance.' },
    { id: 'd1d', t: 1, attr: 'chance', text: 'In a very small group of {A}, the {C1} allele becomes more common over a few years by luck alone. It does not help or harm the {A}.' },
    /* ---- round 2: describe what happened ---- */
    { id: 'm2a', t: 2, attr: 'new', text: 'The first {A1} with {X} in the whole population is born. None of its ancestors had it, and no {A1} has arrived from another group.' },
    { id: 'm2b', t: 2, attr: 'new', text: 'A {A1} has an allele for {X} that is not found in any other {A1} in the population or in its parents. Nothing came from outside.' },
    { id: 'm2c', t: 2, attr: 'new', text: 'For generations every one of the {A} was {C1}. One year an egg hatches a {C2} one. Its parents and grandparents were all {C1}, and the group is cut off from all others.' },
    { id: 'm2d', t: 2, attr: 'new', text: 'A new allele for {X} appears in the population. Every existing {A1} lacks it, and the population has been isolated for years.' },
    { id: 'g2a', t: 2, attr: 'move', text: 'Two populations of {A} live on opposite sides of a river. A new bridge lets them meet and breed, so alleles pass from one population to the other.' },
    { id: 'g2b', t: 2, attr: 'move', text: 'A farmer buys {N} {A} from another farm and breeds them with his own, so alleles from the other farm are now in his population.' },
    { id: 'g2c', t: 2, attr: 'move', text: 'After a hurricane, {A} from a nearby island arrive and breed with the island {A}. Alleles for {X} that were not on the island before are now found there.' },
    { id: 'g2d', t: 2, attr: 'move', text: 'Some of the {A} leave their group to join a different group, and take their alleles for {X} with them.' },
    { id: 's2a', t: 2, attr: 'trait', text: 'A new disease kills {A} that do not have an allele for resistance. The ones that have it survive and breed, so the allele becomes common.' },
    { id: 's2b', t: 2, attr: 'trait', text: 'In a cold winter, {A} with thick fur survive more often than those with thin fur, and so leave more young. The thick-fur allele is passed on more.' },
    { id: 's2c', t: 2, attr: 'trait', text: '{A} with an allele for {X} find food more easily, so they live longer and have more young than the other {A}.' },
    { id: 's2d', t: 2, attr: 'trait', text: 'A poison in a stream kills {A} that lack a protective allele. The survivors, which have it, pass it on.' },
    { id: 'd2a', t: 2, attr: 'chance', text: 'In a population of just {N} {A}, the allele for {X} disappears one year. Having it made no difference to survival or to the number of young: it was simply lost.' },
    { id: 'd2b', t: 2, attr: 'chance', text: 'A tree falls on {N} of the {A} in a small pond. The {A} it hits are no different from the others in any way.' },
    { id: 'd2c', t: 2, attr: 'chance', text: 'Only {N} {A} are left after a fire that burned the whole area. The fire did not choose by any trait. The {C1} allele is now much rarer than it was.' },
    { id: 'd2d', t: 2, attr: 'chance', text: 'A small population of {A} is cut to {N} by a landslide that kills {A} at random. The survivors’ allele frequencies are different from before, and no allele helped them.' },
    /* ---- round 3: the obvious cue is wrong. top = the hardest ---- */
    { id: 'm3a', t: 3, top: true, attr: 'new', text: 'For hundreds of generations every one of the {A} on the island was {C1}. One year a {C2} one is born. Its parents and all its ancestors were {C1}, and no {A1} has come from anywhere else.', trap: '“Born” sounds like ordinary variation, but no ancestor had it and nothing came from outside, so the allele is new.' },
    { id: 'm3b', t: 3, top: true, attr: 'new', text: 'In a pond cut off from every other pond for years, one egg hatches a {A1} with an allele for {X} that no pond {A1} has ever had.', trap: 'Nothing can come in from other ponds, so the allele can only be new.' },
    { id: 'm3c', t: 3, attr: 'new', text: 'A {A1} is born with {X}. Its parents did not have it, nobody has moved in, and no {A1} in the population carried that allele before.', trap: 'No parent had it and nobody moved in: the allele is new.' },
    { id: 'm3d', t: 3, attr: 'new', text: 'After years of isolation, a brand new allele for {X} appears in the {A}, though none of them, or their relatives, had it.', trap: 'Isolated, and nobody had it before: the allele is new.' },
    { id: 'g3a', t: 3, top: true, attr: 'move', text: 'Alleles for {X}, which were not in the population before, are found in the {A} after a few {A} arrive on a floating log from the mainland.', trap: '“Appear” sounds like mutation, but they arrived on the log: the alleles moved in.' },
    { id: 'g3b', t: 3, top: true, attr: 'move', text: 'A population of {A} loses some of its alleles for {X} when {N} of its {A} leave to join a different population.', trap: 'Losing alleles sounds like drift, but it happened because animals LEFT: movement between populations.' },
    { id: 'g3c', t: 3, attr: 'move', text: 'A farmer swaps {N} {A} with a neighbour. After the swap, each farm’s {A} carry alleles for {X} that came from the other farm.', trap: 'Alleles came from the other farm: movement between populations.' },
    { id: 'g3d', t: 3, attr: 'move', text: 'A bridge is built between two valleys. Within a few years the {A} in both valleys share alleles for {X} that only one valley had.', trap: 'The bridge let alleles pass between the valleys.' },
    { id: 's3a', t: 3, top: true, attr: 'trait', text: 'Chance blows seeds into a cold valley. The seedlings with an allele for frost resistance live, and the others die.', trap: '“Chance” is only how the seeds got there. The allele decided who lived, so it is selection.' },
    { id: 's3b', t: 3, attr: 'trait', text: 'Of {N} young {A}, the ones with an allele for fast running escape the predators and survive. The slow ones are caught.', trap: 'The allele for speed decided who survived.' },
    { id: 's3c', t: 3, top: true, attr: 'trait', text: 'A storm throws all of the {A} into cold water. Those with an allele for thick fat stay warm and live; the others die of the cold.', trap: 'A storm sounds like chance, but the allele for thick fat decided who lived, so it is selection.' },
    { id: 's3d', t: 3, attr: 'trait', text: 'By bad luck a hard winter comes. The {A} with an allele for storing fat survive it, and the thin ones do not.', trap: '“Bad luck” is the winter. The allele for storing fat decided who survived.' },
    { id: 'd3a', t: 3, top: true, attr: 'chance', text: 'A bird eats the first {N} {A} it finds. It does not choose by colour, but by chance most of them are {C1}.', trap: '“Eats” sounds like selection, but the bird did not choose by colour: it was chance.' },
    { id: 'd3b', t: 3, attr: 'chance', text: 'A tree falls on a small pond and crushes {N} of the {A}. The {A} it crushes are not different in any way from the others.', trap: 'The crushed {A} were no different: chance.' },
    { id: 'd3c', t: 3, attr: 'chance', text: 'In a tiny group, one pair of {A} happens to have far more young than the others by luck. Their alleles become common, though they are no better.', trap: 'They were no better: luck decided.' },
    { id: 'd3d', t: 3, top: true, attr: 'chance', text: 'A flood sweeps {N} of the {A} out to sea. Which ones went was pure chance: the ones left behind happen to carry fewer alleles for {X}.', trap: '“Out to sea” sounds like movement between populations, but they did not join another population: they were lost by chance.' }
  ];

  var MISTAKE = {
    mutation: 'A new allele appeared here. Mutation is the only force that makes new alleles.',
    geneflow: 'Alleles moved between populations here.',
    selection: 'Here the trait decided who survived and had young.',
    drift: 'Here chance decided, and no trait was involved.'
  };
  function mistakeMsg(chosen, right) {
    if (chosen === 'selection' && right === 'drift') return 'Natural selection needs the trait to decide who survives. Here it was chance, so the trait did not matter.';
    if (chosen === 'drift' && right === 'selection') return 'Genetic drift is chance. Here the trait decided who survived, so it is not random.';
    if (chosen === 'mutation') return 'No new allele appeared here: the alleles already existed.';
    if (chosen === 'geneflow') return 'Nothing moved in or out here: look at what decided the change.';
    if (right === 'mutation') return 'The change came from a NEW allele, not from survival or chance.';
    if (right === 'geneflow') return 'The change came from alleles MOVING between populations.';
    return 'Check what decided it: the trait, or chance.';
  }

  function generate(code) {
    var rnd = makeRng(code);
    var int = function (a, b) { return a + Math.floor(rnd() * (b - a + 1)); };
    var pick = function (arr) { return arr[Math.floor(rnd() * arr.length)]; };
    var shuffle = function (arr) { var r = arr.slice(); for (var i = r.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)); var t = r[i]; r[i] = r[j]; r[j] = t; } return r; };
    var cap = function (s) { return s.charAt(0).toUpperCase() + s.slice(1); };
    function fill(tpl) {
      var an = pick(ANIMALS), cc = pick(COLOURS), x = pick(TRAITS), n = int(3, 9);
      var sing = { beetles: 'beetle', mice: 'mouse', snails: 'snail', lizards: 'lizard', frogs: 'frog', finches: 'finch', moths: 'moth', voles: 'vole' }[an];
      function sub(s) { return s.replace(/\{A1\}/g, sing).replace(/\{A\}/g, an).replace(/\{X\}/g, x).replace(/\{N\}/g, ['', '', '', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine'][n]).replace(/\{C1\}/g, cc[0]).replace(/\{C2\}/g, cc[1]); }
      var text = sub(tpl.text).replace(/^([a-z])/, function (m) { return m.toUpperCase(); });
      text = text.replace(/\. ([a-z])/g, function (m, c) { return '. ' + c.toUpperCase(); });
      return { tid: tpl.id, tier: tpl.t, text: text, attr: tpl.attr, force: BY_ATTR[tpl.attr], top: !!tpl.top, trap: tpl.trap ? sub(tpl.trap) : '', animal: an, n: n, trait: x, colours: cc };
    }
    var rounds = [];
    for (var r = 1; r <= 3; r++) {
      var items = [];
      FORCES.forEach(function (f) {
        var pool = T.filter(function (t) { return t.t === r && BY_ATTR[t.attr] === f; });
        if (r < 3) shuffle(pool).slice(0, 3).forEach(function (t) { items.push(fill(t)); });
        else {
          var ord = shuffle(pool.filter(function (t) { return !t.top; })), top = shuffle(pool.filter(function (t) { return t.top; }));
          ord.slice(0, 2).forEach(function (t) { items.push(fill(t)); }); items.push(fill(top[0]));
        }
      });
      var boards;
      if (r < 3) {
        for (var tries = 0; tries < 500; tries++) {
          var sh = shuffle(items); boards = [sh.slice(0, 4), sh.slice(4, 8), sh.slice(8, 12)];
          if (boards.every(function (b) { var s = {}; b.forEach(function (q) { s[q.force] = 1; }); return Object.keys(s).length >= 3; })) break;
        }
      } else {
        var tops = items.filter(function (q) { return q.top; }), rest = shuffle(items.filter(function (q) { return !q.top; }));
        boards = [rest.slice(0, 4), rest.slice(4, 8), shuffle(tops)];
      }
      rounds.push(boards);
    }
    var out = [];
    rounds.forEach(function (boards, ri) {
      boards.forEach(function (b, bi) {
        var order = shuffle(FORCES);
        b.forEach(function (q, k) {
          q.round = ri + 1; q.board = bi + 1; q.pos = k + 1; q.n = bi * 4 + k + 1; q.cat = q.force; q.kind = 'match'; q.order = order;
          q.why = WHY[q.force]; q.prompt = q.text;
          out.push(q);
        });
      });
    });
    return out;
  }

  /* ================================================================== *
   * THE GAME
   * ================================================================== */
  var ROUND_NAMES = ['Match the force', 'No clue words', 'Beat the game'];
  var HABIT = {};
  FORCES.forEach(function (a) { FORCES.forEach(function (b) { if (a !== b) HABIT[a + '-for-' + b] = 'You chose ' + FNAME[a].toLowerCase() + ' when the answer was ' + FNAME[b].toLowerCase() + '. ' + mistakeMsg(a, b) + ' Ask the four questions: a new allele? alleles moving? did the trait decide it? or chance?'; }); });
  var GENERIC = 'Ask the four questions: a new allele? alleles moving between populations? did the trait decide it? or chance?';

  var app = document.getElementById('app');
  var state, locked, boardStart, lastAct, sel, roundStart;
  function fromHash() { var h = (location.hash || '').replace('#', '').toUpperCase(); return validCode(h) ? h : null; }
  function fresh(code) { var c = code || newCode(); state = { code: c, qs: generate(c), r: 0, b: 0, results: [], screen: 'start' }; sel = null; }
  function qi(k) { return state.r * 12 + state.b * 4 + k; }
  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function clear() { app.innerHTML = ''; }
  var esc = function (s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };
  function display(Q) { return Q.text + ' | ' + Q.order.map(function (f) { return FNAME[f]; }).join(' / '); }

  function start() {
    clear(); state.screen = 'start';
    var card = el('div', 'card');
    card.appendChild(el('h1', null, 'Pairs'));
    card.appendChild(el('p', 'lead', 'Match each scenario to the force that changed the gene pool: <b>mutation</b>, <b>gene flow</b>, <b>natural selection</b> or <b>genetic drift</b>. Three rounds of three boards. Each round is harder than the one before.'));
    card.appendChild(el('p', 'lead', 'Ask four questions: Did a NEW allele appear? Did alleles MOVE between populations? Did the TRAIT decide who survived? Or was it CHANCE?'));
    card.appendChild(el('p', 'lead', 'Round 3 goes far past the lesson. The obvious cue is often wrong, and the last board is meant to be almost impossible. Do what you can and read the reasons.'));
    card.appendChild(el('p', 'small', 'You get one go at each scenario. A wrong answer tells you what the mistake probably was. There is no timer on the questions, and you can stop and see your results at any time. Some of the scenarios are made up. Your questions are different from everyone else’s. Game code <span class="code" id="code">' + state.code + '</span>'));
    app.appendChild(card);
    var b = el('button', 'btn', 'Start round 1'); b.id = 'start'; b.onclick = beginRound; app.appendChild(b); b.focus();
  }
  function beginRound() { state.b = 0; roundStart = Date.now(); board(); }
  function header() {
    var h = el('header');
    h.appendChild(el('span', 'pill' + (state.r === 2 ? ' hard' : ''), 'Round ' + (state.r + 1) + ' · ' + ROUND_NAMES[state.r] + ' · board ' + (state.b + 1) + ' of 3'));
    var d = el('div', 'dots'); d.setAttribute('aria-label', 'Board ' + (state.b + 1) + ' of 3');
    for (var k = 0; k < 12; k++) { var res = state.results[state.r * 12 + k]; d.appendChild(el('span', 'dot' + (res ? (res.ok ? ' right' : ' wrong') : ''))); }
    h.appendChild(d); return h;
  }
  var LETTERS = ['A', 'B', 'C', 'D'];
  function board() {
    clear(); state.screen = 'question'; locked = false; sel = null; boardStart = lastAct = Date.now();
    app.appendChild(header());
    var Q0 = state.qs[qi(0)];
    var card = el('div', 'card'); card.id = 'qcard';
    card.appendChild(el('p', 'ask', 'Tap a scenario, then tap its force.'));
    card.setAttribute('data-display', [0, 1, 2, 3].map(function (k) { return state.qs[qi(k)].text; }).join(' || ') + ' | ' + Q0.order.map(function (f) { return FNAME[f]; }).join(' / '));
    app.appendChild(card);
    var list = el('div'); list.id = 'scens';
    for (var k = 0; k < 4; k++) {
      (function (k) {
        var wrap = el('div', 'scenwrap'); wrap.dataset.k = String(k);
        var b = el('button', 'scen', '<b>' + (k + 1) + '</b><span class="stext">' + esc(state.qs[qi(k)].text) + '</span>');
        b.type = 'button'; b.dataset.s = String(k); b.setAttribute('aria-label', 'Scenario ' + (k + 1));
        b.onclick = function () { pickScenario(k); };
        wrap.appendChild(b); var fb = el('div', 'hide'); fb.className = 'fb hide'; wrap.appendChild(fb); list.appendChild(wrap);
      })(k);
    }
    app.appendChild(list);
    app.appendChild(el('p', 'hint', 'Tap a scenario first.')).id = 'hint';
    var fr = el('div', 'forces'); fr.id = 'forces';
    Q0.order.forEach(function (f, i) {
      var b = el('button', 'force', '<b>' + LETTERS[i] + '</b><span>' + FNAME[f] + '</span>'); b.type = 'button'; b.dataset.f = f; b.setAttribute('aria-label', 'Force ' + LETTERS[i] + ': ' + FNAME[f]);
      b.onclick = function () { pickForce(f); }; fr.appendChild(b);
    });
    app.appendChild(fr);
    var go = el('button', 'btn hide', 'Next board'); go.id = 'nextbtn'; go.type = 'button'; go.onclick = next; app.appendChild(go);
    var stop = el('button', 'btn ghost small', 'Stop and see my results'); stop.id = 'stop'; stop.type = 'button'; stop.style.marginTop = '14px'; stop.onclick = final; app.appendChild(stop);
  }
  function answered(k) { return !!state.results[qi(k)]; }
  function pickScenario(k) {
    if (state.screen !== 'question' || answered(k)) return;
    sel = k;
    document.querySelectorAll('.scen').forEach(function (b, i) { b.classList.toggle('sel', i === k && !answered(i)); });
    document.getElementById('hint').textContent = 'Now tap the force for scenario ' + (k + 1) + '.';
  }
  function pickForce(f) {
    if (state.screen !== 'question') return;
    if (sel === null || answered(sel)) { document.getElementById('hint').textContent = 'Tap a scenario first.'; return; }
    check(sel, f);
  }
  function check(k, f) {
    var Q = state.qs[qi(k)], ok = f === Q.force, now = Date.now();
    var tag = ok ? null : f + '-for-' + Q.force;
    state.results[qi(k)] = { ok: ok, given: f, tag: tag, cat: Q.cat, secs: Math.max(1, Math.round((now - lastAct) / 1000)), wrote: FNAME[f] };
    lastAct = now;
    var wrap = document.querySelectorAll('.scenwrap')[k], b = wrap.querySelector('.scen'), fb = wrap.querySelector('.fb');
    b.classList.remove('sel'); b.classList.add(ok ? 'right' : 'wrong'); b.disabled = true;
    b.querySelector('span.stext').insertAdjacentHTML('beforeend', '<span class="chip">' + (ok ? 'Correct: ' : 'You chose ' + esc(FNAME[f]) + '. The answer is ') + esc(FNAME[Q.force]) + '</span>');
    fb.className = 'fb ' + (ok ? 'right' : 'wrong');
    fb.innerHTML = '<b>' + (ok ? 'Correct.' : 'Not quite. The answer is ' + esc(FNAME[Q.force]) + '.') + '</b> ' + (ok ? '' : esc(mistakeMsg(f, Q.force)) + ' ') + (Q.trap ? esc(Q.trap) + ' ' : '') + esc(Q.why);
    document.querySelectorAll('.dots .dot').forEach(function (d, i) { if (i === state.b * 4 + k) d.className = 'dot ' + (ok ? 'right' : 'wrong'); });
    sel = null;
    document.getElementById('hint').textContent = [0, 1, 2, 3].every(answered) ? 'Board done.' : 'Tap the next scenario.';
    if ([0, 1, 2, 3].every(answered)) {
      var last = state.b === 2, go = document.getElementById('nextbtn'); go.textContent = last ? (state.r === 2 ? 'See results' : 'Finish round') : 'Next board'; go.classList.remove('hide');
      document.querySelectorAll('.force').forEach(function (x) { x.disabled = true; });
    }
    fb.scrollIntoView({ block: 'nearest' });
  }
  function next() { if (state.b < 2) { state.b++; board(); } else roundEnd(); }

  function fmtTime(secs) { return secs < 60 ? secs + ' s' : Math.floor(secs / 60) + ' min ' + (secs % 60) + ' s'; }
  function reviewItem(r, k) {
    var Q = state.qs[r * 12 + k], x = state.results[r * 12 + k], n = r * 12 + k + 1;
    var h = '<div class="rq" data-q="' + n + '"><div class="top"><span class="qn">Scenario ' + n + '</span>';
    if (!x) return h + '<span class="verdict na">Not reached</span></div><div class="txt">' + esc(Q.text) + '</div></div>';
    h += '<span class="meta">' + fmtTime(x.secs) + '</span></div><div class="txt">' + esc(Q.text) + '</div>';
    if (x.ok) return h + '<div class="verdict ok">Correct: ' + esc(FNAME[Q.force]) + '</div></div>';
    h += '<div class="verdict no">Wrong</div><div class="wrote">You chose <b>' + esc(x.wrote) + '</b>. The answer is <b>' + esc(FNAME[Q.force]) + '</b>.</div><p class="how">How to get there:</p><div class="work"><div>' + esc(mistakeMsg(x.given, Q.force)) + '</div>' + (Q.trap ? '<div>' + esc(Q.trap) + '</div>' : '') + '<div>' + esc(Q.why) + '</div></div>';
    return h + '</div>';
  }
  function reviewHtml(r, open) {
    var mine = state.results.slice(r * 12, r * 12 + 12), done = mine.filter(function (x) { return x; }), right = done.filter(function (x) { return x.ok; }).length;
    var secs = done.reduce(function (a, x) { return a + x.secs; }, 0);
    var sum = 'Round ' + (r + 1) + ' · ' + ROUND_NAMES[r] + ' · ' + right + ' of ' + (done.length === 12 ? 12 : done.length + ' answered') + (done.length ? ' · ' + fmtTime(secs) : '');
    var body = ''; for (var k = 0; k < 12; k++) body += reviewItem(r, k);
    return '<details class="review" data-round="' + (r + 1) + '"' + (open ? ' open' : '') + '><summary><span>' + sum + '</span></summary>' + body + '</details>';
  }
  function roundEnd() {
    clear(); state.screen = 'round';
    var mine = state.results.slice(state.r * 12, state.r * 12 + 12), right = mine.filter(function (x) { return x && x.ok; }).length, secs = Math.round((Date.now() - roundStart) / 1000);
    var card = el('div', 'card');
    card.appendChild(el('h2', null, 'Round ' + (state.r + 1) + ' done'));
    card.appendChild(el('div', 'score', right + ' of 12'));
    card.appendChild(el('p', 'small', 'Round time ' + Math.floor(secs / 60) + ' min ' + (secs % 60) + ' s. The time does not count for anything.'));
    card.appendChild(el('p', 'small', 'Open the summary to see how long each scenario took, and the reason for any you missed.'));
    card.insertAdjacentHTML('beforeend', reviewHtml(state.r, false));
    app.appendChild(card);
    var b = el('button', 'btn', state.r < 2 ? 'Start round ' + (state.r + 2) : 'See what to practise'); b.id = 'roundnext';
    b.onclick = function () { if (state.r < 2) { state.r++; beginRound(); } else final(); }; app.appendChild(b); b.focus();
  }
  function final() {
    clear(); state.screen = 'final';
    var done = state.results.filter(function (x) { return x; }), total = done.filter(function (x) { return x.ok; }).length;
    var card = el('div', 'card'); card.appendChild(el('h2', null, 'What to practise')); card.appendChild(el('div', 'score', total + ' of 36'));
    if (done.length < 36) card.appendChild(el('p', 'small', done.length + ' of 36 scenarios answered.'));
    FORCES.forEach(function (c) {
      var all = state.qs.filter(function (Q) { return Q.cat === c; }).length, rs = done.filter(function (x) { return x.cat === c; }), ok = rs.filter(function (x) { return x.ok; }).length;
      card.appendChild(el('div', 'row', '<span><b>' + FNAME[c] + '</b><br><span class="small">' + ok + ' of ' + all + (rs.length < all ? ' (' + (all - rs.length) + ' not reached)' : '') + '</span></span><span class="bar" aria-hidden="true"><i style="width:' + Math.round(100 * ok / all) + '%"></i></span>'));
    });
    app.appendChild(card);
    var rev = el('div', 'card'); rev.appendChild(el('h2', null, 'Every scenario'));
    rev.appendChild(el('p', 'small', 'Open a round to see the time for each scenario, what you chose and the reason for each right answer.'));
    for (var rr = 0; rr < 3; rr++) rev.insertAdjacentHTML('beforeend', reviewHtml(rr, false));
    app.appendChild(rev);
    var tips = el('div', 'card'); tips.appendChild(el('h2', null, 'Your mistakes'));
    var counts = {}; done.forEach(function (x) { if (!x.ok) counts[x.tag] = (counts[x.tag] || 0) + 1; });
    var tags = Object.keys(counts);
    if (!tags.length) tips.appendChild(el('p', 'lead', done.length ? 'No mistakes. Every answer you gave was right.' : 'You did not answer any scenarios.'));
    else { var ul = el('ul', 'tips'); tags.forEach(function (t) { var n = counts[t]; ul.appendChild(el('li', null, '<b>' + n + (n === 1 ? ' time. ' : ' times. ') + '</b>' + esc(HABIT[t] || GENERIC))); }); tips.appendChild(ul); }
    tips.appendChild(el('p', 'small', 'Game code <span class="code">' + state.code + '</span>. Your teacher can open this file with #' + state.code + ' on the end of the address to see the same scenarios.'));
    app.appendChild(tips);
    var b = el('button', 'btn ghost', 'Play again'); b.id = 'again'; b.onclick = function () { fresh(); start(); }; app.appendChild(b); b.focus();
  }
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey || state.screen !== 'question') return;
    if (/^[1-4]$/.test(e.key)) { e.preventDefault(); pickScenario(parseInt(e.key, 10) - 1); }
    else if (/^[a-dA-D]$/.test(e.key)) { e.preventDefault(); var i = e.key.toUpperCase().charCodeAt(0) - 65; pickForce(state.qs[qi(0)].order[i]); }
    else if (e.key === 'Enter' && [0, 1, 2, 3].every(answered)) { e.preventDefault(); next(); }
  });
  window.__game = { generate: generate, newCode: newCode, questions: function () { return state.qs; }, code: function () { return state.code; }, display: display, forces: FNAME };
  fresh(fromHash()); start();
})();
</script>
</body>
