<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Net Force</title>
<style>
  :root {
    --forest: #17203F; --amber: #FF8A3D; --amberink: #C25A16; --teal: #1FB6BC; --rust: #E03D6B; --cream: #F2F4FA; --cream2: #DDE2F0;
    --ink: #141A30; --soft: #5A6480; --green: #1E8E5A; --white: #fff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--cream); color: var(--ink); font-family: Arial, Helvetica, sans-serif; -webkit-text-size-adjust: 100%; }
  body { min-height: 100vh; display: flex; justify-content: center; }
  #app { width: 100%; max-width: 820px; padding: 14px 16px 28px; }
  h1, h2 { font-family: Georgia, 'Times New Roman', serif; color: var(--forest); margin: 0; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .pill { background: var(--forest); color: var(--white); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; border-radius: 999px; padding: 7px 14px; white-space: nowrap; }
  .pill.hard { background: var(--rust); }
  .dots { display: flex; gap: 6px; }
  .dot { width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--forest); background: var(--white); }
  .dot.now { background: var(--cream2); } .dot.right { background: var(--green); border-color: var(--green); } .dot.wrong { background: var(--rust); border-color: var(--rust); }
  .card { background: var(--white); border: 2px solid var(--cream2); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .ask { font-size: 19px; color: var(--forest); font-weight: 700; margin: 0 0 12px; line-height: 1.35; }
  .ask small { display: block; font-size: 15px; font-weight: 400; color: var(--soft); margin-top: 6px; }
  .sub { font-size: 15px; color: var(--soft); margin: 8px 0 0; line-height: 1.4; }
  /* rock layers */
  table.chart { border-collapse: collapse; margin: 6px 0; font-size: 14px; width: 100%; }
  .chartwrap { overflow-x: auto; max-width: 100%; }
  table.chart th, table.chart td { border: 1px solid #6F5F4B; padding: 4px 3px; text-align: center; min-width: 26px; }
  table.chart th { background: var(--cream2); font-size: 13px; }
  table.chart td.on { background: var(--amber); } table.chart td.off { background: var(--white); }
  table.chart td.name { text-align: left; white-space: nowrap; font-weight: 700; }
  #answer { height: 64px; border: 3px solid var(--forest); border-radius: 12px; background: var(--white); font-size: 34px; font-weight: 700; color: var(--forest); display: flex; align-items: center; padding: 0 16px; margin-bottom: 12px; font-family: Georgia, serif; }
  #answer.empty { color: #9AA59D; font-weight: 400; font-size: 20px; font-family: Arial, sans-serif; }
  .unit { font-size: 15px; color: var(--soft); margin: -6px 0 10px; }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  button { font: inherit; cursor: pointer; }
  .key { height: 58px; font-size: 28px; font-weight: 700; color: var(--forest); background: var(--white); border: 2px solid var(--cream2); border-radius: 12px; touch-action: manipulation; }
  .key:active { background: var(--cream2); } .key.fn { background: var(--cream); font-size: 22px; }
  .key.go, .btn { background: var(--forest); color: var(--white); border: 2px solid var(--forest); }
  .key.go { font-size: 20px; grid-column: 1 / -1; }
  .btn { padding: 15px 26px; border-radius: 12px; font-size: 18px; font-weight: 700; min-height: 54px; touch-action: manipulation; }
  .btn.ghost { background: var(--white); color: var(--forest); } .btn.small { padding: 8px 14px; font-size: 14px; min-height: 44px; }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, summary:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
  .opts { display: grid; gap: 10px; margin-bottom: 12px; }
  .opt { display: flex; align-items: center; gap: 12px; text-align: left; min-height: 58px; padding: 8px 14px; background: var(--white); border: 2px solid var(--cream2); border-radius: 12px; font-size: 17px; font-weight: 700; color: var(--forest); touch-action: manipulation; line-height: 1.3; }
  .opt b { width: 32px; height: 32px; border-radius: 50%; background: var(--cream2); display: flex; align-items: center; justify-content: center; font-size: 16px; flex: none; }
  .opt.correct { border-color: var(--green); background: #EAF6EF; } .opt.picked { border-color: var(--rust); background: #FBEAE6; }
  #feedback { border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; border: 3px solid; }
  #feedback.right { border-color: var(--green); background: #EAF6EF; } #feedback.wrong { border-color: var(--rust); background: #FBEAE6; }
  #feedback .head { font-size: 21px; font-weight: 700; margin-bottom: 6px; } #feedback.right .head { color: var(--green); } #feedback.wrong .head { color: var(--rust); }
  #feedback .msg { font-size: 17px; font-weight: 700; color: var(--forest); margin-bottom: 8px; }
  .how { font-size: 15px; color: var(--soft); margin: 6px 0 2px; }
  .work { font-size: 17px; color: var(--forest); font-weight: 700; line-height: 1.5; } .work div { margin: 2px 0; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--cream2); }
  .row:last-child { border-bottom: 0; }
  .bar { height: 12px; border-radius: 6px; background: var(--cream2); overflow: hidden; width: 140px; flex: none; } .bar i { display: block; height: 100%; background: var(--green); }
  .lead { font-size: 18px; line-height: 1.45; } .small { font-size: 13px; color: var(--soft); }
  .score { font-size: 44px; font-family: Georgia, serif; font-weight: 700; color: var(--forest); }
  ul.tips { padding-left: 20px; margin: 8px 0 0; } ul.tips li { margin: 8px 0; font-size: 17px; line-height: 1.4; }
  .code { font-family: 'Courier New', monospace; font-weight: 700; letter-spacing: .12em; color: var(--forest); }
  details.review { border: 2px solid var(--cream2); border-radius: 12px; background: var(--white); margin: 10px 0 0; }
  details.review > summary { cursor: pointer; padding: 12px 14px; font-weight: 700; color: var(--forest); font-size: 16px; line-height: 1.35; list-style: none; display: flex; justify-content: space-between; gap: 10px; align-items: center; min-height: 48px; }
  details.review > summary::-webkit-details-marker { display: none; } details.review > summary::after { content: '▾'; font-size: 18px; flex: none; }
  details.review[open] > summary::after { transform: rotate(180deg); }
  .rq { padding: 12px 14px; border-top: 1px solid var(--cream2); }
  .rq .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .rq .qn { font-weight: 700; color: var(--forest); font-size: 15px; } .rq .meta { font-size: 14px; color: var(--soft); white-space: nowrap; }
  .rq .verdict { font-weight: 700; font-size: 15px; } .verdict.ok { color: var(--green); } .verdict.no { color: var(--rust); } .verdict.na { color: var(--soft); }
  .rq .txt { font-size: 15px; line-height: 1.4; margin: 4px 0; } .rq .wrote { font-size: 15px; margin: 6px 0 2px; color: var(--forest); }
  .hide { display: none !important; }
  .treefig { margin: 6px 0 10px; } .treefig svg { width: 100%; max-width: 360px; height: auto; display: block; }
  .treefig text { font-family: Arial, Helvetica, sans-serif; fill: #182B1E; } .treefig .leaf { font-weight: 700; font-size: 16px; } .treefig .len { font-size: 13px; fill: #A8651F; font-weight: 700; }
  .treefig line { stroke: #1F3D2B; stroke-width: 2.5; stroke-linecap: round; }
  table.chart td.num { min-width: 34px; } table.chart td.blank { background: var(--cream2); }
  caption { caption-side: bottom; font-size: 13px; color: var(--soft); padding-top: 4px; text-align: left; }

  .fbdfig { margin: 6px 0 10px; } .fbdfig svg { width: 100%; max-width: 560px; height: auto; display: block; background: #fff; border: 2px solid var(--cream2); border-radius: 12px; }
  .fbdfig text { font-family: Arial, Helvetica, sans-serif; font-weight: 700; font-size: 15px; }
  .legend { font-size: 14px; color: var(--soft); margin-top: 4px; }
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<script>
(function () {
  'use strict';

  /* ================================================================== *
   * NET FORCE (Resultant Forces). Nobody gets the same game.
   *
   * Every question is built from a template with random forces, names, directions and
   * numbers, from a six-character game code that is random for each student. Opening the
   * file with #CODE on the end of the address gives the same game again, so a teacher can
   * see exactly what a student saw. The SKILLS and their order are the same for everyone, so
   * the diagnostic at the end means the same thing for every student.
   *
   * ALL FORCES ARE ALONG ONE STRAIGHT LINE (the lesson's own limit): left and right, or up and
   * down. A resultant never mixes the two. The picture of each free-body diagram is drawn from
   * the data the question keeps (the arrows are to scale), and build/check-resultant-forces-game.py
   * re-derives every resultant, every mistake value and every line of working from that data.
   *
   * DIFFICULTY RAMPS, AND THE END IS MEANT TO BE HARD. Round 1 is the lesson. Round 2 is three or
   * more forces, balanced or not, and a missing force. Round 3 goes far past it: a diagram with
   * distractors, the odd one out, a steady speed, a missing force, and then two questions drawn
   * from small pools of very hard puzzles (a hanging mass with g, a tug of war, a parachutist, a
   * missing force from a resultant). A student who fails them still gets the working.
   * ================================================================== */
  var ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  function newCode() {
    var out = '', bytes = new Uint8Array(6);
    if (window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(bytes);
    else for (var k = 0; k < 6; k++) bytes[k] = Math.floor(Math.random() * 256);
    for (var i = 0; i < 6; i++) out += ALPHABET[bytes[i] % ALPHABET.length];
    return out;
  }
  function validCode(c) { return typeof c === 'string' && /^[A-HJ-NP-Z2-9]{6}$/.test(c); }
  function makeRng(code) {
    var h = 1779033703 ^ code.length;
    for (var i = 0; i < code.length; i++) { h = Math.imul(h ^ code.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
    var a = (h ^ (h >>> 16)) >>> 0;
    return function () { a = (a + 0x6D2B79F5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  var DRIVE = ['Push', 'Pull', 'Thrust', 'Driving force'], RESIST = ['Friction', 'Air resistance', 'Drag', 'Water resistance'];
  var CONTACT1 = [
    { id: 'friction', bin: 'contact', text: 'the friction on a box sliding along the floor', why: 'The surfaces touch and rub, so friction is a contact force.' },
    { id: 'tension', bin: 'contact', text: 'the tension in a rope pulling a sledge', why: 'The rope touches the sledge and pulls it, so tension is a contact force.' },
    { id: 'weight', bin: 'non', text: 'the weight of a book', why: 'Gravity pulls without touching, so weight is a non-contact force.' },
    { id: 'magnet', bin: 'non', text: 'the force between two magnets', why: 'Magnets pull or push across a gap, so the magnetic force is a non-contact force.' }
  ];
  var CONTACT2 = [
    { id: 'air', bin: 'contact', text: 'the air resistance on a falling parachutist', why: 'Air is made of particles that touch the parachutist and push, so air resistance is a contact force.' },
    { id: 'reaction', bin: 'contact', text: 'the reaction force from a table on a book', why: 'The table touches the book and pushes up, so the reaction force is a contact force.' },
    { id: 'upthrust', bin: 'contact', text: 'the upthrust on a boat floating on water', why: 'The water touches the boat and pushes up, so upthrust is a contact force.' },
    { id: 'thrust', bin: 'contact', text: 'the thrust of a rocket engine', why: 'The hot gases push on the rocket, so thrust is a contact force.' },
    { id: 'balloon', bin: 'non', text: 'the force between a rubbed balloon and a wall', why: 'Charges pull across a small gap, so the electrostatic force is a non-contact force.' },
    { id: 'fall', bin: 'non', text: 'the weight of a falling ball', why: 'Gravity pulls without touching, so weight is a non-contact force.' }
  ];
  var CONTACT_NAMES = ['Friction', 'Tension', 'Air resistance', 'Reaction force', 'Upthrust', 'Thrust'], NON_NAMES = ['Weight', 'Magnetic force', 'Electrostatic force'];
  var NAMEQ = [
    { id: 'book', text: 'A book rests on a table. Which force acts UPWARDS on the book?', right: 'Reaction force', wrong: ['Weight', 'Friction', 'Air resistance', 'Tension'], why: 'The table pushes up on the book. That is the reaction force.' },
    { id: 'ball', text: 'A ball falls through the air. Which force pulls it DOWNWARDS?', right: 'Weight', wrong: ['Reaction force', 'Friction', 'Upthrust', 'Tension'], why: 'Gravity pulls the ball down. That is its weight.' },
    { id: 'box', text: 'A box is pushed to the right along the floor. Which force acts to the LEFT on the box?', right: 'Friction', wrong: ['Weight', 'Reaction force', 'Upthrust', 'Tension'], why: 'The floor rubs against the box and opposes the push. That is friction.' },
    { id: 'chute', text: 'A parachutist falls. Which force acts UPWARDS on the parachutist?', right: 'Air resistance', wrong: ['Weight', 'Reaction force', 'Friction', 'Tension'], why: 'The air pushes up against the parachute. That is air resistance.' },
    { id: 'boat', text: 'A boat floats on water. Which force from the water acts UPWARDS on the boat?', right: 'Upthrust', wrong: ['Weight', 'Friction', 'Air resistance', 'Tension'], why: 'The water pushes up on the boat. That is upthrust.' },
    { id: 'bucket', text: 'A bucket hangs from a rope. Which force acts UPWARDS on the bucket?', right: 'Tension', wrong: ['Weight', 'Reaction force', 'Friction', 'Upthrust'], why: 'The rope pulls up on the bucket. That is tension.' }
  ];

  function generate(code) {
    var rnd = makeRng(code);
    var int = function (a, b) { return a + Math.floor(rnd() * (b - a + 1)); };
    var pick = function (arr) { return arr[Math.floor(rnd() * arr.length)]; };
    var shuffle = function (arr) { var r = arr.slice(); for (var i = r.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)); var t = r[i]; r[i] = r[j]; r[j] = t; } return r; };
    var until = function (f) { for (var t = 0; t < 20000; t++) { var r = f(); if (r) return r; } throw new Error('generator stuck'); };
    var W = function (value, tag, how, msg) { return { value: value, tag: tag, how: how, msg: msg }; };
    var five = function (a, b) { return 5 * int(a / 5, b / 5); };
    var sum = function (a) { return a.reduce(function (x, y) { return x + y; }, 0); };
    var joinSum = function (a) { return a.join(' + '); };
    function arrange(correct, wrongs) { var all = shuffle([correct].concat(wrongs)); return { options: all, correctIndex: all.indexOf(correct) }; }
    var Q = function (cat, kind, o) { o.cat = cat; o.kind = kind; return o; };
    var dirText = function (d) { return d > 0 ? 'to the right' : 'to the left'; };

    /* a horizontal line of forces: nR forces to the right, nL to the left, sizes in newtons, distinct names */
    function makeForces(nR, nL, flip) {
      var drive = shuffle(DRIVE), resist = shuffle(RESIST), forces = [];
      for (var i = 0; i < nR; i++) forces.push({ name: (flip ? resist : drive)[i], dir: 'right', n: five(10, 150) });
      for (var j = 0; j < nL; j++) forces.push({ name: (flip ? drive : resist)[j], dir: 'left', n: five(10, 150) });
      return forces;
    }
    var rightSum = function (f) { return sum(f.filter(function (x) { return x.dir === 'right'; }).map(function (x) { return x.n; })); };
    var leftSum = function (f) { return sum(f.filter(function (x) { return x.dir === 'left'; }).map(function (x) { return x.n; })); };
    var listN = function (f, d) { return f.filter(function (x) { return x.dir === d; }).map(function (x) { return x.n; }); };
    function workLines(forces) {
      var r = listN(forces, 'right'), l = listN(forces, 'left'), R = sum(r) - sum(l), lines = [];
      if (r.length > 1) lines.push(joinSum(r) + ' = ' + sum(r)); if (l.length > 1) lines.push(joinSum(l) + ' = ' + sum(l));
      lines.push(Math.max(sum(r), sum(l)) + ' − ' + Math.min(sum(r), sum(l)) + ' = ' + Math.abs(R));
      return lines;
    }
    var resText = function (R) { return R === 0 ? 'Balanced: the resultant is 0 N' : Math.abs(R) + ' N ' + dirText(R); };

    /* ---------------- contact and non-contact ---------------- */
    function contactQ(item) {
      var opts = shuffle([{ text: 'Contact', bin: 'contact' }, { text: 'Non-contact', bin: 'non' }]);
      opts.forEach(function (o) { if (o.bin === item.bin) o.tag = null; else { o.tag = item.bin === 'contact' ? 'contactasnon' : 'nonascontact'; o.msg = item.id === 'air' ? 'Air is invisible, but it is made of particles that touch the object. Air resistance is a contact force.' : item.bin === 'contact' ? 'The two things touch each other here. It is a contact force.' : 'The two things do not need to touch. It is a non-contact force.'; } });
      return Q('contact', 'contact', { prompt: 'Is ' + item.text + ' a contact force or a non-contact force?', item: item, bin: item.bin, options: opts, correctIndex: opts.map(function (o) { return o.tag === null; }).indexOf(true), explain: [item.why, 'Test: do the two things need to touch? If they do, it is a contact force.'] });
    }
    function oddOne() {
      var cn = shuffle(CONTACT_NAMES).slice(0, 3), non = pick(NON_NAMES);
      var wr = cn.map(function (n) { return { text: n, tag: 'contactchosen', msg: n + ' is a contact force: the objects touch.' }; });
      var a = arrange({ text: non, tag: null }, wr);
      return Q('contact', 'oddOne', { prompt: 'Three of these are contact forces. Which one is NOT a contact force?', names: cn.concat([non]), odd: non, options: a.options, correctIndex: a.correctIndex, explain: [non + ' acts without the objects touching, so it is a non-contact force.', 'The other three need the objects to touch.'] });
    }

    /* ---------------- the resultant, as a choice ---------------- */
    function resMCQ(nR, nL, flip) {
      return until(function () {
        var f = makeForces(nR, nL, flip), R = rightSum(f) - leftSum(f); if (R === 0) return null;
        var correct = { text: resText(R), tag: null };
        var cand = [];
        var total = rightSum(f) + leftSum(f), dirR = R > 0 ? 1 : -1;
        if (nL > 0 && nR > 0) {
          cand.push({ text: total + ' N ' + dirText(dirR), tag: 'addedall', msg: 'You added all the forces. Forces that point opposite ways subtract.' });
          cand.push({ text: Math.abs(R) + ' N ' + dirText(-dirR), tag: 'wrongway', msg: 'The size is right, but the resultant points the way of the BIGGER total, not the smaller.' });
          cand.push({ text: 'Balanced: the resultant is 0 N', tag: 'zero', msg: 'The forces are not equal, so they do not cancel.' });
          var big = Math.max.apply(null, f.map(function (x) { return x.n; })); cand.push({ text: big + ' N ' + dirText(f.filter(function (x) { return x.n === big; })[0].dir === 'right' ? 1 : -1), tag: 'biggest', msg: 'You used only the biggest force. The resultant uses all of them.' });
          if (f.length > 2) { var sm = f.slice().sort(function (a, b) { return a.n - b.n; })[0], RR = R - (sm.dir === 'right' ? sm.n : -sm.n); if (RR !== 0) cand.push({ text: Math.abs(RR) + ' N ' + dirText(RR > 0 ? 1 : -1), tag: 'forgot', msg: 'You left out the ' + sm.name.toLowerCase() + '. Every force on the diagram counts.' }); }
        } else {
          cand.push({ text: Math.abs(R) + ' N ' + dirText(-dirR), tag: 'wrongway', msg: 'The size is right, but the forces point ' + dirText(dirR) + ', so the resultant does too.' });
          cand.push({ text: Math.abs(R) + ' N', tag: 'nodir', msg: 'A resultant needs a direction as well as a size.' });
          cand.push({ text: 'Balanced: the resultant is 0 N', tag: 'zero', msg: 'Forces that point the same way add. They do not cancel.' });
          var mx = Math.max.apply(null, f.map(function (x) { return x.n; })); cand.push({ text: mx + ' N ' + dirText(dirR), tag: 'biggest', msg: 'You used only the biggest force. Forces that point the same way add.' });
        }
        var seen = {}; seen[correct.text] = 1; var wr = [];
        shuffle(cand).forEach(function (c) { if (!seen[c.text] && wr.length < 3) { seen[c.text] = 1; wr.push(c); } });
        if (wr.length < 3) return null;
        var a = arrange(correct, wr);
        return Q('resultant', 'resMCQ', { prompt: 'All the forces act along one straight line. What is the resultant force?', figure: { type: 'fbd', forces: f }, forces: f, R: R, options: a.options, correctIndex: a.correctIndex,
          explain: workLines(f).concat([sameWay(f, R)]) });
      });
    }
    function sameWay(f, R) { return 'The resultant is ' + resText(R).replace('Balanced: the resultant is ', '') + '.'; }

    function balancedQ() {
      return until(function () {
        var bal = rnd() < 0.5, nR = int(1, 2), nL = int(1, 2), f = makeForces(nR, nL, rnd() < 0.5);
        if (bal) { // make the left total equal the right total by adjusting the last left force
          var need = rightSum(f) - (leftSum(f) - f.filter(function (x) { return x.dir === 'left'; }).slice(-1)[0].n); if (need < 5) return null;
          f.filter(function (x) { return x.dir === 'left'; }).slice(-1)[0].n = need;
        }
        var R = rightSum(f) - leftSum(f); if ((R === 0) !== bal) return null; if (bal && f.some(function (x) { return x.n > 300; })) return null;
        var texts = ['Balanced: the resultant is 0 N', 'Not balanced: the resultant is to the right', 'Not balanced: the resultant is to the left'];
        var right = R === 0 ? 0 : R > 0 ? 1 : 2;
        var opts = texts.map(function (t, i) { return { text: t, tag: i === right ? null : (R === 0 ? 'unbal' : (i === 0 ? 'zero' : 'wrongway')), msg: i === right ? '' : (R === 0 ? 'The two totals are equal, so the forces cancel: balanced.' : (i === 0 ? 'The totals are not equal, so the forces do not cancel.' : 'The resultant points the way of the BIGGER total.')) }; });
        opts = shuffle(opts);
        return Q('resultant', 'balanced', { prompt: 'All the forces act along one straight line. Are the forces balanced?', figure: { type: 'fbd', forces: f }, forces: f, R: R, options: opts, correctIndex: opts.map(function (o) { return o.tag === null; }).indexOf(true),
          explain: workLines(f).concat([R === 0 ? 'The forces are balanced.' : 'The forces are not balanced.']) });
      });
    }

    /* ---------------- the resultant, as a number ---------------- */
    function numWrongs(f, R) {
      var r = listN(f, 'right'), l = listN(f, 'left'), w = [];
      w.push(W(sum(r) + sum(l), 'addedall', joinSum(r.concat(l)), 'You added all the forces. Forces that point opposite ways subtract.'));
      var sm = f.slice().sort(function (a, b) { return a.n - b.n; })[0];
      var rr2 = sum(r) - (sm.dir === 'right' ? sm.n : 0), ll2 = sum(l) - (sm.dir === 'left' ? sm.n : 0), RR = Math.abs(rr2 - ll2); w.push(W(RR, 'forgot', '|' + rr2 + ' - ' + ll2 + '|', 'You left out the ' + sm.name.toLowerCase() + '. Every force counts.'));

    return (Q.method ? '<p class="how">' + esc(Q.method) + '</p>' : '') + (expl ? '<div class="work">' + expl + '</div>' : '') + (lines ? '<p class="how">Working:</p><div class="work">' + lines + '</div>' : '');
  }
  function correctText(Q) { return isMCQ(Q) ? Q.options[Q.correctIndex].text : String(Q.answer) + (Q.unit ? ' ' + Q.unit : ''); }
  function check(given, picked) {
    var Q = q(), ok, tag = null, msg = '', head, wrote;
    if (isMCQ(Q)) {
      ok = picked === Q.correctIndex; wrote = Q.options[picked].text;
      if (!ok) { tag = Q.options[picked].tag || 'other'; msg = Q.options[picked].msg || GENERIC; }
      head = ok ? 'Correct.' : 'Not quite. The answer is: ' + Q.options[Q.correctIndex].text;
      document.querySelectorAll('.opt').forEach(function (b, k) { b.disabled = true; if (k === Q.correctIndex) b.classList.add('correct'); else if (k === picked) b.classList.add('picked'); });
    } else {
      ok = given === Q.answer; wrote = String(given); var w = ok ? null : Q.wrong[String(given)];
      tag = ok ? null : (w ? w.tag : 'other'); msg = ok ? '' : (w ? w.msg : GENERIC);
      head = ok ? 'Correct.' : 'Not quite. The answer is ' + Q.answer + (Q.unit ? ' ' + Q.unit : '') + '.';
      document.getElementById('answer').style.opacity = '.6';
    }
    state.results[idx()] = { ok: ok, given: given, tag: tag, cat: Q.cat, secs: Math.max(1, Math.round((Date.now() - qStart) / 1000)), wrote: wrote };
    locked = true;
    var fb = document.getElementById('feedback'); fb.className = ok ? 'right' : 'wrong';
    fb.innerHTML = '<div class="head">' + esc(head) + '</div>' + (msg ? '<div class="msg">' + esc(msg) + '</div>' : '') + workHtml(Q);
    var last = state.i === 5, label = last ? (state.r === 2 ? 'See results' : 'Finish round') : 'Next';
    var goBtn = document.querySelector('.key.go') || document.getElementById('nextbtn'); goBtn.textContent = label; goBtn.classList.remove('hide');
    document.querySelectorAll('.dot')[state.i].className = 'dot ' + (ok ? 'right' : 'wrong');
    fb.scrollIntoView({ block: 'nearest' });
  }
  function next() { if (state.i < 5) { state.i++; question(); } else roundEnd(); }

  function fmtTime(secs) { return secs < 60 ? secs + ' s' : Math.floor(secs / 60) + ' min ' + (secs % 60) + ' s'; }
  function reviewItem(r, k) {
    var Q = state.qs[r * 6 + k], x = state.results[r * 6 + k], n = r * 6 + k + 1;
    var h = '<div class="rq" data-q="' + n + '"><div class="top"><span class="qn">Question ' + n + '</span>';
    if (!x) return h + '<span class="verdict na">Not reached</span></div><div class="txt">' + esc(shortText(Q)) + '</div></div>';
    h += '<span class="meta">' + fmtTime(x.secs) + '</span></div><div class="txt">' + esc(shortText(Q)) + '</div>';
    if (x.ok) return h + '<div class="verdict ok">Correct</div></div>';
    h += '<div class="verdict no">Wrong</div><div class="wrote">You wrote <b>' + esc(x.wrote) + '</b>. The answer is <b>' + esc(correctText(Q)) + '</b>.</div><p class="how">How to get there:</p>' + workHtml(Q);
    return h + '</div>';
  }
  function reviewHtml(r, open) {
    var mine = state.results.slice(r * 6, r * 6 + 6), done = mine.filter(function (x) { return x; }), right = done.filter(function (x) { return x.ok; }).length;
    var secs = done.reduce(function (a, x) { return a + x.secs; }, 0);
    var sum = 'Round ' + (r + 1) + ' · ' + ROUND_NAMES[r] + ' · ' + right + ' of ' + (done.length === 6 ? 6 : done.length + ' answered') + (done.length ? ' · ' + fmtTime(secs) : '');
    var body = ''; for (var k = 0; k < 6; k++) body += reviewItem(r, k);
    return '<details class="review" data-round="' + (r + 1) + '"' + (open ? ' open' : '') + '><summary><span>' + sum + '</span></summary>' + body + '</details>';
  }
  function roundEnd() {
    clear(); state.screen = 'round';
    var mine = state.results.slice(state.r * 6, state.r * 6 + 6), right = mine.filter(function (x) { return x && x.ok; }).length, secs = Math.round((Date.now() - roundStart) / 1000);
    var card = el('div', 'card');
    card.appendChild(el('h2', null, 'Round ' + (state.r + 1) + ' done'));
    card.appendChild(el('div', 'score', right + ' of 6'));
    card.appendChild(el('p', 'small', 'Round time ' + Math.floor(secs / 60) + ' min ' + (secs % 60) + ' s. The time does not count for anything.'));
    card.appendChild(el('p', 'small', 'Open the summary to see how long each question took, and how to get to the answer for any you missed.'));
    card.insertAdjacentHTML('beforeend', reviewHtml(state.r, false));
    app.appendChild(card);
    var b = el('button', 'btn', state.r < 2 ? 'Start round ' + (state.r + 2) : 'See what to practise'); b.id = 'roundnext';
    b.onclick = function () { if (state.r < 2) { state.r++; beginRound(); } else final(); }; app.appendChild(b); b.focus();
  }
  function final() {
    clear(); state.screen = 'final';
    var done = state.results.filter(function (x) { return x; }), total = done.filter(function (x) { return x.ok; }).length;
    var card = el('div', 'card'); card.appendChild(el('h2', null, 'What to practise')); card.appendChild(el('div', 'score', total + ' of 18'));
    if (done.length < 18) card.appendChild(el('p', 'small', done.length + ' of 18 questions answered.'));
    Object.keys(CATS).forEach(function (c) {
      var all = state.qs.filter(function (Q) { return Q.cat === c; }).length, rs = done.filter(function (x) { return x.cat === c; }), ok = rs.filter(function (x) { return x.ok; }).length;
      card.appendChild(el('div', 'row', '<span><b>' + CATS[c] + '</b><br><span class="small">' + ok + ' of ' + all + (rs.length < all ? ' (' + (all - rs.length) + ' not reached)' : '') + '</span></span><span class="bar" aria-hidden="true"><i style="width:' + Math.round(100 * ok / all) + '%"></i></span>'));
    });
    app.appendChild(card);
    var rev = el('div', 'card'); rev.appendChild(el('h2', null, 'Every question'));
    rev.appendChild(el('p', 'small', 'Open a round to see the time for each question, what you wrote and how to get to each right answer.'));
    for (var rr = 0; rr < 3; rr++) rev.insertAdjacentHTML('beforeend', reviewHtml(rr, false));
    app.appendChild(rev);
    var tips = el('div', 'card'); tips.appendChild(el('h2', null, 'Your mistakes'));
    var counts = {}; done.forEach(function (x) { if (!x.ok) counts[x.tag] = (counts[x.tag] || 0) + 1; });
    var tags = Object.keys(counts);
    if (!tags.length) tips.appendChild(el('p', 'lead', done.length ? 'No mistakes. Every answer you gave was right.' : 'You did not answer any questions.'));
    else { var ul = el('ul', 'tips'); tags.forEach(function (t) { var n = counts[t]; ul.appendChild(el('li', null, '<b>' + n + (n === 1 ? ' time. ' : ' times. ') + '</b>' + esc(HABIT[t] || GENERIC))); }); tips.appendChild(ul); }
    tips.appendChild(el('p', 'small', 'Game code <span class="code">' + state.code + '</span>. Your teacher can open this file with #' + state.code + ' on the end of the address to see the same questions.'));
    app.appendChild(tips);
    var b = el('button', 'btn ghost', 'Play again'); b.id = 'again'; b.onclick = function () { fresh(); start(); }; app.appendChild(b); b.focus();
  }
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey || state.screen !== 'question') return;
    var Q = q();
    if (isMCQ(Q)) {
      if (/^[1-4]$/.test(e.key) && !locked) { var k = parseInt(e.key, 10) - 1; if (k < Q.options.length) { e.preventDefault(); pressOpt(k); } }
      else if (e.key === 'Enter' && locked) { e.preventDefault(); next(); }
      return;
    }
    if (/^[0-9]$/.test(e.key)) { e.preventDefault(); press(e.key); }
    else if (e.key === 'Backspace') { e.preventDefault(); press('back'); }
    else if (e.key === 'Enter') { e.preventDefault(); press('go'); }
  });
  window.__game = { generate: generate, newCode: newCode, questions: function () { return state.qs; }, code: function () { return state.code; }, display: display };
  fresh(fromHash()); start();
})();
</script>
</body>
