<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Float Or Sink</title>
<style>
  :root {
    --earth: #0B3D4C; --gold: #FF8952; --goldink: #C25A29; --slate: #1FA37A; --terra: #D63447; --sand: #EFF6F7; --sand2: #D7E8EA;
    --ink: #0C2730; --soft: #4E6D74; --green: #1F7A48; --white: #fff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--sand); color: var(--ink); font-family: Arial, Helvetica, sans-serif; -webkit-text-size-adjust: 100%; }
  body { min-height: 100vh; display: flex; justify-content: center; }
  #app { width: 100%; max-width: 820px; padding: 14px 16px 28px; }
  h1, h2 { font-family: Georgia, 'Times New Roman', serif; color: var(--earth); margin: 0; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .pill { background: var(--earth); color: var(--white); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; border-radius: 999px; padding: 7px 14px; white-space: nowrap; }
  .pill.hard { background: var(--terra); }
  .dots { display: flex; gap: 6px; }
  .dot { width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--earth); background: var(--white); }
  .dot.now { background: var(--sand2); } .dot.right { background: var(--green); border-color: var(--green); } .dot.wrong { background: var(--terra); border-color: var(--terra); }
  .card { background: var(--white); border: 2px solid var(--sand2); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .ask { font-size: 19px; color: var(--earth); font-weight: 700; margin: 0 0 12px; line-height: 1.35; }
  .ask small { display: block; font-size: 15px; font-weight: 400; color: var(--soft); margin-top: 6px; }
  .sub { font-size: 15px; color: var(--soft); margin: 8px 0 0; line-height: 1.4; }
  /* rock layers */
  table.chart { border-collapse: collapse; margin: 6px 0; font-size: 14px; width: 100%; }
  .chartwrap { overflow-x: auto; max-width: 100%; }
  table.chart th, table.chart td { border: 1px solid #6F5F4B; padding: 4px 3px; text-align: center; min-width: 26px; }
  table.chart th { background: var(--sand2); font-size: 13px; }
  table.chart td.on { background: var(--gold); } table.chart td.off { background: var(--white); }
  #answer { height: 64px; border: 3px solid var(--earth); border-radius: 12px; background: var(--white); font-size: 34px; font-weight: 700; color: var(--earth); display: flex; align-items: center; padding: 0 16px; margin-bottom: 12px; font-family: Georgia, serif; }
  #answer.empty { color: #9AA59D; font-weight: 400; font-size: 20px; font-family: Arial, sans-serif; }
  .unit { font-size: 15px; color: var(--soft); margin: -6px 0 10px; }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  button { font: inherit; cursor: pointer; }
  .key { height: 58px; font-size: 28px; font-weight: 700; color: var(--earth); background: var(--white); border: 2px solid var(--sand2); border-radius: 12px; touch-action: manipulation; }
  .key:active { background: var(--sand2); } .key.fn { background: var(--sand); font-size: 22px; }
  .key.go, .btn { background: var(--earth); color: var(--white); border: 2px solid var(--earth); }
  .key.go { font-size: 20px; grid-column: 1 / -1; }
  .btn { padding: 15px 26px; border-radius: 12px; font-size: 18px; font-weight: 700; min-height: 54px; touch-action: manipulation; }
  .btn.ghost { background: var(--white); color: var(--earth); } .btn.small { padding: 8px 14px; font-size: 14px; min-height: 44px; }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, summary:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .opts { display: grid; gap: 10px; margin-bottom: 12px; }
  .opt { display: flex; align-items: center; gap: 12px; text-align: left; min-height: 58px; padding: 8px 14px; background: var(--white); border: 2px solid var(--sand2); border-radius: 12px; font-size: 17px; font-weight: 700; color: var(--earth); touch-action: manipulation; line-height: 1.3; }
  .opt b { width: 32px; height: 32px; border-radius: 50%; background: var(--sand2); display: flex; align-items: center; justify-content: center; font-size: 16px; flex: none; }
  .opt.correct { border-color: var(--green); background: #EAF6EF; } .opt.picked { border-color: var(--terra); background: #FBEAE6; }
  #feedback { border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; border: 3px solid; }
  #feedback.right { border-color: var(--green); background: #EAF6EF; } #feedback.wrong { border-color: var(--terra); background: #FBEAE6; }
  #feedback .head { font-size: 21px; font-weight: 700; margin-bottom: 6px; } #feedback.right .head { color: var(--green); } #feedback.wrong .head { color: var(--terra); }
  #feedback .msg { font-size: 17px; font-weight: 700; color: var(--earth); margin-bottom: 8px; }
  .how { font-size: 15px; color: var(--soft); margin: 6px 0 2px; }
  .work { font-size: 17px; color: var(--earth); font-weight: 700; line-height: 1.5; } .work div { margin: 2px 0; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--sand2); }
  .row:last-child { border-bottom: 0; }
  .bar { height: 12px; border-radius: 6px; background: var(--sand2); overflow: hidden; width: 140px; flex: none; } .bar i { display: block; height: 100%; background: var(--green); }
  .lead { font-size: 18px; line-height: 1.45; } .small { font-size: 13px; color: var(--soft); }
  .score { font-size: 44px; font-family: Georgia, serif; font-weight: 700; color: var(--earth); }
  ul.tips { padding-left: 20px; margin: 8px 0 0; } ul.tips li { margin: 8px 0; font-size: 17px; line-height: 1.4; }
  .code { font-family: 'Courier New', monospace; font-weight: 700; letter-spacing: .12em; color: var(--earth); }
  details.review { border: 2px solid var(--sand2); border-radius: 12px; background: var(--white); margin: 10px 0 0; }
  details.review > summary { cursor: pointer; padding: 12px 14px; font-weight: 700; color: var(--earth); font-size: 16px; line-height: 1.35; list-style: none; display: flex; justify-content: space-between; gap: 10px; align-items: center; min-height: 48px; }
  details.review > summary::-webkit-details-marker { display: none; } details.review > summary::after { content: '▾'; font-size: 18px; flex: none; }
  details.review[open] > summary::after { transform: rotate(180deg); }
  .rq { padding: 12px 14px; border-top: 1px solid var(--sand2); }
  .rq .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .rq .qn { font-weight: 700; color: var(--earth); font-size: 15px; } .rq .meta { font-size: 14px; color: var(--soft); white-space: nowrap; }
  .rq .verdict { font-weight: 700; font-size: 15px; } .verdict.ok { color: var(--green); } .verdict.no { color: var(--terra); } .verdict.na { color: var(--soft); }
  .rq .txt { font-size: 15px; line-height: 1.4; margin: 4px 0; } .rq .wrote { font-size: 15px; margin: 6px 0 2px; color: var(--earth); }
  .hide { display: none !important; }
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<script>
(function () {
  'use strict';

  /* ================================================================== *
   * FLOAT OR SINK. Nobody gets the same game.
   *
   * Every question is built from a template with random materials and numbers, from a game code
   * that is different for each student. Opening the file with #CODE after the address gives the
   * same game again, so a teacher can see exactly what a student saw. The SKILLS and their order
   * are the same for everyone, so the diagnostic at the end means the same thing for every
   * student. Every question uses the same four options, shuffled: Floats, Sinks, Stays suspended,
   * Not enough information — the last two are real, correct answers for specific questions
   * (round 3), not padding, which is what makes "not enough information" a genuine trap rather
   * than a safe default everywhere else.
   *
   * Round 1 gives both densities directly. Round 2 gives mass and volume, so the density has to
   * be found first. Round 3 is hollow objects, switching the liquid, and the two hardest pool
   * questions: an object whose density exactly equals the liquid's (neutral buoyancy — it stays
   * suspended), and a reversed problem (given the outcome, find a missing number). A student who
   * fails them still gets the working.
   * ================================================================== */
  var ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  function newCode() {
    var out = '', bytes = new Uint8Array(6);
    if (window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(bytes);
    else for (var k = 0; k < 6; k++) bytes[k] = Math.floor(Math.random() * 256);
    for (var i = 0; i < 6; i++) out += ALPHABET[bytes[i] % ALPHABET.length];
    return out;
  }
  function validCode(c) { return typeof c === 'string' && /^[A-HJ-NP-Z2-9]{6}$/.test(c); }
  function makeRng(code) {
    var h = 1779033703 ^ code.length;
    for (var i = 0; i < code.length; i++) { h = Math.imul(h ^ code.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
    var a = (h ^ (h >>> 16)) >>> 0;
    return function () { a = (a + 0x6D2B79F5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  var MATERIALS = [
    ['cork', 0.25], ['oak wood', 0.85], ['ice', 0.92], ['aluminium', 2.70], ['steel', 7.90], ['gold', 19.3], ['pine wood', 0.50], ['glass', 2.50]
  ];
  var LIQUIDS = { water: 1.00, seawater: 1.03, mercury: 13.6 };
  var OUT_TEXT = ['Floats', 'Sinks', 'Stays suspended', 'Not enough information'];

  function generate(code) {
    var rnd = makeRng(code);
    var int = function (a, b) { return a + Math.floor(rnd() * (b - a + 1)); };
    var pick = function (arr) { return arr[Math.floor(rnd() * arr.length)]; };
    var shuffle = function (arr) { var r = arr.slice(); for (var i = r.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)); var t = r[i]; r[i] = r[j]; r[j] = t; } return r; };
    var until = function (f) { for (var t = 0; t < 8000; t++) { var r = f(); if (r) return r; } throw new Error('generator stuck'); };
    var Q = function (cat, kind, o) { o.cat = cat; o.kind = kind; return o; };
    var round1 = function (x) { return Math.round(x * 100) / 100; };

    /** Build the four fixed options, shuffled, with the correct one at `correctText`. Every wrong
     *  option carries `tag` (the KIND of question, not which option was clicked), so the
     *  end-of-game tally groups mistakes by the misconception, the same fix as Numbers Drill. */
    function arrange(correctText, msgFor, tag) {
      var order = shuffle([0, 1, 2, 3]);
      var options = order.map(function (i) {
        var text = OUT_TEXT[i];
        return { text: text, tag: text === correctText ? null : tag, msg: text === correctText ? '' : msgFor(text) };
      });
      return { options: options, correctIndex: options.map(function (o) { return o.tag === null; }).indexOf(true) };
    }
    function verdict(obj, liq) { return obj < liq ? 'Floats' : obj > liq ? 'Sinks' : 'Stays suspended'; }

    /* ---------------- Round 1: compare given densities ---------------- */
    function compareQ() {
      return until(function () {
        var mat = pick(MATERIALS), liqName = pick(Object.keys(LIQUIDS)), liq = LIQUIDS[liqName];
        var v = verdict(mat[1], liq);
        if (v === 'Stays suspended') return null;          // exact ties are reserved for the pool question
        var msgFor = function (opt) {
          if (opt === 'Not enough information') return 'Comparing the two densities IS enough: ' + mat[1].toFixed(2) + ' against ' + liq.toFixed(2) + ' g/cm³.';
          if (opt === 'Stays suspended') return 'The two densities are different, ' + mat[1].toFixed(2) + ' and ' + liq.toFixed(2) + ' g/cm³, so it is not a tie.';
          return v === 'Floats' ? mat[1].toFixed(2) + ' is lower than ' + liq.toFixed(2) + ' g/cm³, so it floats.' : mat[1].toFixed(2) + ' is higher than ' + liq.toFixed(2) + ' g/cm³, so it sinks.';
        };
        var arr = arrange(v, msgFor, 'compare');
        return Q('compare', 'compare', { prompt: cap(mat[0]) + ' has a density of ' + mat[1].toFixed(2) + ' g/cm³. ' + capLiquid(liqName) + '’s density is ' + liq.toFixed(2) + ' g/cm³. Determine what happens when ' + mat[0] + ' is placed in ' + liqName + '.',
          material: mat[0], density: mat[1], liquid: liqName, liquidDensity: liq, options: arr.options, correctIndex: arr.correctIndex,
          explain: [v === 'Floats' ? mat[1].toFixed(2) + ' g/cm³ is lower than ' + liq.toFixed(2) + ' g/cm³, so it floats.' : mat[1].toFixed(2) + ' g/cm³ is higher than ' + liq.toFixed(2) + ' g/cm³, so it sinks.'] });
      });
    }
    function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
    function capLiquid(s) { return s === 'water' ? 'Water' : s === 'seawater' ? 'Seawater' : 'Mercury'; }

    /* ---------------- Round 2: calculate the density, then decide ---------------- */
    function calcQ() {
      return until(function () {
        var mat = pick(MATERIALS), liqName = pick(['water', 'seawater']), liq = LIQUIDS[liqName];
        var volume = int(4, 20);
        var mass = round1(mat[1] * volume);
        if (Math.round(mass) !== mass && mass * 10 !== Math.round(mass * 10)) return null;   // keep mass to 1 dp, avoid ugly numbers
        mass = Math.round(mass * 10) / 10;
        var density = round1(mass / volume);
        var v = verdict(density, liq);
        if (v === 'Stays suspended' || Math.abs(density - liq) < 0.05) return null;          // keep round 2 unambiguous
        var msgFor = function (opt) {
          if (opt === 'Not enough information') return 'Mass ÷ volume gives the density: ' + mass + ' ÷ ' + volume + ' = ' + density.toFixed(2) + ' g/cm³. That is enough.';
          if (opt === 'Stays suspended') return 'The calculated density, ' + density.toFixed(2) + ' g/cm³, is not exactly equal to ' + liq.toFixed(2) + ' g/cm³.';
          return v === 'Floats' ? 'The density is ' + density.toFixed(2) + ' g/cm³, lower than ' + liq.toFixed(2) + ', so it floats.' : 'The density is ' + density.toFixed(2) + ' g/cm³, higher than ' + liq.toFixed(2) + ', so it sinks.';
        };
        var arr = arrange(v, msgFor, 'calc');
        return Q('calc', 'calc', { prompt: 'An object has a mass of ' + mass + ' g and a volume of ' + volume + ' cm³. ' + capLiquid(liqName) + '’s density is ' + liq.toFixed(2) + ' g/cm³. Determine what happens when it is placed in ' + liqName + '.',
          mass: mass, volume: volume, liquid: liqName, liquidDensity: liq, options: arr.options, correctIndex: arr.correctIndex,
          explain: [mass + ' ÷ ' + volume + ' = ' + density.toFixed(2) + ' g/cm³.', v === 'Floats' ? 'Lower than ' + liq.toFixed(2) + ' g/cm³, so it floats.' : 'Higher than ' + liq.toFixed(2) + ' g/cm³, so it sinks.'] });
      });
    }

    /* ---------------- Round 3: hollow objects, and switching the liquid ---------------- */
    function hollowQ() {
      return until(function () {
        var mass = int(20, 90) * 5, volume = int(int(mass / 100 + 1, mass / 40) * 2, mass);   // engineered so mass/volume < 1 usually
        volume = int(Math.ceil(mass / 0.6), Math.ceil(mass / 0.2));
        var density = round1(mass / volume);
        var v = verdict(density, 1.00);
        if (v === 'Stays suspended' || Math.abs(density - 1.00) < 0.05) return null;
        var msgFor = function (opt) {
          if (opt === 'Not enough information') return 'Mass ÷ total volume (including the air inside) gives the average density: ' + mass + ' ÷ ' + volume + ' = ' + density.toFixed(2) + ' g/cm³.';
          if (opt === 'Stays suspended') return 'The average density, ' + density.toFixed(2) + ' g/cm³, is not exactly 1.00 g/cm³.';
          return v === 'Floats' ? 'Average density ' + density.toFixed(2) + ' g/cm³ is lower than water\'s 1.00 g/cm³, so it floats.' : 'Average density ' + density.toFixed(2) + ' g/cm³ is higher than water\'s 1.00 g/cm³, so it sinks.';
        };
        var arr = arrange(v, msgFor, 'hollow');
        return Q('hollow', 'hollow', { prompt: 'A hollow container has a total mass of ' + mass + ' g and a total volume of ' + volume + ' cm³, including the air inside. Water’s density is 1.00 g/cm³. Determine what happens when it is placed in water.',
          mass: mass, volume: volume, options: arr.options, correctIndex: arr.correctIndex,
          explain: [mass + ' ÷ ' + volume + ' = ' + density.toFixed(2) + ' g/cm³ (the average density).', v === 'Floats' ? 'Lower than 1.00 g/cm³, so it floats.' : 'Higher than 1.00 g/cm³, so it sinks.'] });
      });
    }
    function switchQ() {
      return until(function () {
        var lo = int(96, 104) / 100;
        if (Math.abs(lo - 1.00) < 0.005 || Math.abs(lo - 1.03) < 0.005) return null;
        var freshV = verdict(lo, 1.00), seaV = verdict(lo, 1.03);
        if (freshV === seaV || freshV === 'Stays suspended' || seaV === 'Stays suspended') return null;   // want a genuine switch
        var msgFor = function (opt) {
          if (opt === 'Not enough information') return 'Both densities are given: ' + lo.toFixed(2) + ' against seawater\'s 1.03 g/cm³. That is enough.';
          if (opt === 'Stays suspended') return lo.toFixed(2) + ' g/cm³ is not exactly equal to seawater\'s 1.03 g/cm³.';
          return seaV === 'Floats' ? lo.toFixed(2) + ' is lower than seawater\'s 1.03 g/cm³, so it floats there.' : lo.toFixed(2) + ' is higher than seawater\'s 1.03 g/cm³, so it sinks there.';
        };
        var arr = arrange(seaV, msgFor, 'switch');
        return Q('switch', 'switch', { prompt: 'An object has a density of ' + lo.toFixed(2) + ' g/cm³. It ' + (freshV === 'Floats' ? 'floats' : 'sinks') + ' in fresh water (density 1.00 g/cm³). Determine what happens to the SAME object in seawater (density 1.03 g/cm³).',
          density: lo, freshVerdict: freshV, options: arr.options, correctIndex: arr.correctIndex,
          explain: [lo.toFixed(2) + ' g/cm³ against seawater\'s 1.03 g/cm³.', seaV === 'Floats' ? 'Lower, so it floats in seawater.' : 'Higher, so it sinks in seawater.'] });
      });
    }
    /* pool item A: neutral buoyancy, a genuine tie */
    function poolSuspended() {
      var mass = int(20, 60), volume = mass;   // mass / volume = 1.00 exactly
      var msgFor = function (opt) {
        if (opt === 'Floats') return 'The object\'s density exactly equals water\'s. It does not rise all the way to the surface.';
        if (opt === 'Sinks') return 'The object\'s density exactly equals water\'s. It does not sink all the way to the bottom.';
        return 'The densities are exactly equal, so it is not a case of "not enough information": the answer is determined.';
      };
      var arr = arrange('Stays suspended', msgFor, 'neutral');
      return Q('puzzle', 'poolSuspended', { prompt: 'An object has a mass of ' + mass + ' g and a volume of ' + volume + ' cm³. Water’s density is 1.00 g/cm³. Determine what happens when it is placed in water.',
        mass: mass, volume: volume, options: arr.options, correctIndex: arr.correctIndex,
        explain: [mass + ' ÷ ' + volume + ' = 1.00 g/cm³, exactly the same as water.', 'Equal densities: the object neither floats to the surface nor sinks to the bottom. It stays suspended.'] });
    }
    /* pool item B: reversed — given the outcome, find the missing volume */
    function poolReverse() {
      return until(function () {
        var mat = pick(MATERIALS.filter(function (m) { return m[1] > 1.2; }));
        var volume = int(6, 30);
        var trueMass = round1(mat[1] * volume);
        if (Math.round(trueMass) !== trueMass) return null;
        var wrongVolume = volume + pick([-3, -2, 2, 3]);
        if (wrongVolume < 1) return null;
        var wrongDensity = round1(trueMass / wrongVolume);
        var claim = verdict(wrongDensity, 1.00);                // the (possibly wrong) claim a student makes using the wrong volume
        if (claim === 'Stays suspended') return null;
        var trueVerdict = verdict(mat[1], 1.00);
        var msgFor = function (opt) {
          if (opt === 'Not enough information') return 'The real density, ' + mat[1].toFixed(2) + ' g/cm³ (mass ÷ the TRUE volume), is enough to decide.';
          if (opt === 'Stays suspended') return mat[1].toFixed(2) + ' g/cm³ is not exactly 1.00 g/cm³.';
          return trueVerdict === 'Floats' ? 'The real density is ' + mat[1].toFixed(2) + ' g/cm³, lower than 1.00, so it actually floats.' : 'The real density is ' + mat[1].toFixed(2) + ' g/cm³, higher than 1.00, so it actually sinks.';
        };
        var arr = arrange(trueVerdict, msgFor, 'reverse');
        return Q('puzzle', 'poolReverse', { prompt: 'A block of ' + mat[0] + ' has a mass of ' + trueMass + ' g. A student measures its volume as ' + wrongVolume + ' cm³ by mistake (the real volume is ' + volume + ' cm³) and concludes it ' + claim.toLowerCase() + ' in water. Using the REAL volume, determine what actually happens.',
          material: mat[0], mass: trueMass, trueVolume: volume, wrongVolume: wrongVolume, options: arr.options, correctIndex: arr.correctIndex,
          explain: [trueMass + ' ÷ ' + volume + ' (the real volume) = ' + mat[1].toFixed(2) + ' g/cm³.', trueVerdict === 'Floats' ? 'Lower than 1.00 g/cm³, so it floats.' : 'Higher than 1.00 g/cm³, so it sinks.'] });
      });
    }

    var r1 = [compareQ(), compareQ(), compareQ(), compareQ(), compareQ(), compareQ()];
    var r2 = [calcQ(), calcQ(), calcQ(), calcQ(), calcQ(), calcQ()];
    var r3fixed = shuffle([hollowQ(), hollowQ(), switchQ(), switchQ()]);
    var Q17 = rnd() < 0.5 ? poolSuspended() : poolReverse();
    var Q18 = Q17.kind === 'poolSuspended' ? poolReverse() : poolSuspended();

    var out = r1.concat(r2, r3fixed, [Q17, Q18]);
    out.forEach(function (q, i) { q.round = Math.floor(i / 6) + 1; q.n = (i % 6) + 1; });
    out.forEach(function (q) { q.cat = q.round === 1 ? 'compare' : q.round === 2 ? 'calc' : 'hard'; });
    return out;
  }

  /* ================================================================== *
   * THE GAME
   * ================================================================== */
  var ROUND_NAMES = ['Compare the densities', 'Calculate, then decide', 'Harder shapes and liquids'];
  var CATS = { compare: 'Compare the densities', calc: 'Calculate, then decide', hard: 'Harder shapes and liquids' };
  var HABIT = {
    compare: 'Compare the two densities directly. Lower than the liquid floats, higher sinks.',
    calc: 'Find the density first, mass ÷ volume, then compare it to the liquid’s density.',
    hollow: 'Use the TOTAL mass and the TOTAL volume, air included, to find the average density.',
    switch: 'The object’s density does not change. Compare it again, against the NEW liquid’s density.',
    neutral: 'Equal densities is a real, different outcome: the object stays suspended, neither floats nor sinks.',
    reverse: 'A wrong measurement gives a wrong density. Redo the division with the REAL numbers before deciding.'
  };
  var GENERIC = 'Read the question again: which density is bigger, the object’s or the liquid’s?';

  var app = document.getElementById('app');
  var state, typed, locked, roundStart, qStart;
  function fromHash() { var h = (location.hash || '').replace('#', '').toUpperCase(); return validCode(h) ? h : null; }
  function fresh(code) { var c = code || newCode(); state = { code: c, qs: generate(c), r: 0, i: 0, results: [], screen: 'start' }; typed = ''; locked = false; }
  function idx() { return state.r * 6 + state.i; }
  function q() { return state.qs[idx()]; }
  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function clear() { app.innerHTML = ''; }
  var esc = function (s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };

  // What is on the screen (also read by the test): the prompt plus the options or the unit.
  function display(Q) {
    var d = Q.prompt;
    if (Q.options) d += ' | ' + Q.options.map(function (o) { return o.text; }).join(' / ');
    if (Q.unit) d += ' | unit ' + Q.unit;
    return d;
  }
  function shortText(Q) { return Q.prompt; }

  /* ---------- screens ---------- */
  function start() {
    clear(); state.screen = 'start';
    var card = el('div', 'card');
    card.appendChild(el('h1', null, 'Float Or Sink'));
    card.appendChild(el('p', 'lead', 'Three rounds of six questions. Every question: Floats, Sinks, Stays suspended, or Not enough information.'));
    card.appendChild(el('p', 'lead', 'Round 3 goes far past the lesson. The last questions are meant to be almost impossible. Do what you can and read the working.'));
    card.appendChild(el('p', 'lead', 'A wrong answer tells you what the mistake probably was. There is no timer on the questions. You can stop and see your results at any time.'));
    card.appendChild(el('p', 'small', 'Your questions are different from everyone else’s. Game code <span class="code" id="code">' + state.code + '</span>'));
    app.appendChild(card);
    var b = el('button', 'btn', 'Start round 1'); b.id = 'start'; b.onclick = beginRound; app.appendChild(b); b.focus();
  }
  function beginRound() { state.i = 0; roundStart = Date.now(); question(); }
  function header() {
    var h = el('header');
    h.appendChild(el('span', 'pill' + (state.r === 2 ? ' hard' : ''), 'Round ' + (state.r + 1) + ' · ' + ROUND_NAMES[state.r]));
    var d = el('div', 'dots'); d.setAttribute('aria-label', 'Question ' + (state.i + 1) + ' of 6');
    for (var k = 0; k < 6; k++) { var res = state.results[state.r * 6 + k]; d.appendChild(el('span', 'dot' + (res ? (res.ok ? ' right' : ' wrong') : (k === state.i ? ' now' : '')))); }
    h.appendChild(d); return h;
  }
  var isMCQ = function (Q) { return !!Q.options; };
  var LETTERS = ['A', 'B', 'C', 'D'];
  function question() {
    clear(); state.screen = 'question'; typed = ''; locked = false; qStart = Date.now();
    var Q = q();
    app.appendChild(header());
    var card = el('div', 'card'); card.id = 'qcard';
    card.innerHTML = '<p class="ask">' + esc(Q.prompt) + '</p>';
    card.setAttribute('data-display', display(Q));
    app.appendChild(card);
    if (isMCQ(Q)) {
      var opts = el('div', 'opts'); opts.id = 'opts';
      Q.options.forEach(function (o, k) {
        var b = el('button', 'opt', '<b>' + LETTERS[k] + '</b><span>' + esc(o.text) + '</span>');
        b.type = 'button'; b.dataset.o = String(k + 1); b.setAttribute('aria-label', 'Option ' + LETTERS[k] + ': ' + o.text);
        b.onclick = function () { pressOpt(k); }; opts.appendChild(b);
      });
      app.appendChild(opts);
    } else {
      var ans = el('div', 'empty'); ans.id = 'answer'; ans.setAttribute('role', 'status'); ans.textContent = 'Type your answer'; app.appendChild(ans);
      if (Q.unit) app.appendChild(el('p', 'unit', 'Give your answer in ' + Q.unit + '.'));
    }
    var fb = el('div', 'hide'); fb.id = 'feedback'; app.appendChild(fb);
    if (!isMCQ(Q)) {
      var pad = el('div', 'pad'); pad.id = 'pad';
      ['1','2','3','4','5','6','7','8','9','', '0','back','go'].forEach(function (k) {
        if (k === '') { pad.appendChild(el('span')); return; }
        var b = el('button', 'key' + (k === 'back' ? ' fn' : k === 'go' ? ' go' : ''), k === 'back' ? '⌫' : k === 'go' ? 'Check' : k);
        b.type = 'button'; b.dataset.k = k; if (k === 'back') b.setAttribute('aria-label', 'Delete'); b.onclick = function () { press(k); }; pad.appendChild(b);
      });
      app.appendChild(pad);
    } else { var go = el('button', 'btn hide', 'Next'); go.id = 'nextbtn'; go.type = 'button'; go.onclick = next; app.appendChild(go); }
    var stop = el('button', 'btn ghost small', 'Stop and see my results'); stop.id = 'stop'; stop.type = 'button'; stop.style.marginTop = '14px'; stop.onclick = final; app.appendChild(stop);
  }
  function paintAnswer() { var a = document.getElementById('answer'); if (!a) return; a.className = typed ? '' : 'empty'; a.textContent = typed || 'Type your answer'; }
  function press(k) {
    if (state.screen !== 'question') return;
    if (locked) { if (k === 'go') next(); return; }
    if (k === 'back') typed = typed.slice(0, -1);
    else if (k === 'go') { if (typed) check(parseInt(typed, 10), null); }
    else if (typed.length < 7) typed += k;
    paintAnswer();
  }
  function pressOpt(k) { if (state.screen !== 'question' || locked) return; check(k + 1, k); }

  function workHtml(Q) {
    var lines = (Q.worked || []).map(function (l) { return '<div>' + esc(l) + '</div>'; }).join('');
    var expl = (Q.explain || []).map(function (l) { return '<div>' + esc(l) + '</div>'; }).join('');
    return (Q.method ? '<p class="how">' + esc(Q.method) + '</p>' : '') + (expl ? '<div class="work">' + expl + '</div>' : '') + (lines ? '<p class="how">Working:</p><div class="work">' + lines + '</div>' : '');
  }
  function correctText(Q) { return isMCQ(Q) ? Q.options[Q.correctIndex].text : String(Q.answer) + (Q.unit ? ' ' + Q.unit : ''); }
  function check(given, picked) {
    var Q = q(), ok, tag = null, msg = '', head, wrote;
    if (isMCQ(Q)) {
      ok = picked === Q.correctIndex; wrote = Q.options[picked].text;
      if (!ok) { tag = Q.options[picked].tag || 'other'; msg = Q.options[picked].msg || GENERIC; }
      head = ok ? 'Correct.' : 'Not quite. The answer is: ' + Q.options[Q.correctIndex].text;
      document.querySelectorAll('.opt').forEach(function (b, k) { b.disabled = true; if (k === Q.correctIndex) b.classList.add('correct'); else if (k === picked) b.classList.add('picked'); });
    } else {
      ok = given === Q.answer; wrote = String(given); var w = ok ? null : Q.wrong[String(given)];
      tag = ok ? null : (w ? w.tag : 'other'); msg = ok ? '' : (w ? w.msg : GENERIC);
      head = ok ? 'Correct.' : 'Not quite. The answer is ' + Q.answer + (Q.unit ? ' ' + Q.unit : '') + '.';
      document.getElementById('answer').style.opacity = '.6';
    }
    state.results[idx()] = { ok: ok, given: given, tag: tag, cat: Q.cat, secs: Math.max(1, Math.round((Date.now() - qStart) / 1000)), wrote: wrote };
    locked = true;
    var fb = document.getElementById('feedback'); fb.className = ok ? 'right' : 'wrong';
    fb.innerHTML = '<div class="head">' + esc(head) + '</div>' + (msg ? '<div class="msg">' + esc(msg) + '</div>' : '') + workHtml(Q);
    var last = state.i === 5, label = last ? (state.r === 2 ? 'See results' : 'Finish round') : 'Next';
    var goBtn = document.querySelector('.key.go') || document.getElementById('nextbtn'); goBtn.textContent = label; goBtn.classList.remove('hide');
    document.querySelectorAll('.dot')[state.i].className = 'dot ' + (ok ? 'right' : 'wrong');
    fb.scrollIntoView({ block: 'nearest' });
  }
  function next() { if (state.i < 5) { state.i++; question(); } else roundEnd(); }

  /* ---------- the review: a drop-down per round; time, right or wrong, what was written and how to get there ---------- */
  function fmtTime(secs) { return secs < 60 ? secs + ' s' : Math.floor(secs / 60) + ' min ' + (secs % 60) + ' s'; }
  function reviewItem(r, k) {
    var Q = state.qs[r * 6 + k], x = state.results[r * 6 + k], n = r * 6 + k + 1;
    var h = '<div class="rq" data-q="' + n + '"><div class="top"><span class="qn">Question ' + n + '</span>';
    if (!x) return h + '<span class="verdict na">Not reached</span></div><div class="txt">' + esc(shortText(Q)) + '</div></div>';
    h += '<span class="meta">' + fmtTime(x.secs) + '</span></div><div class="txt">' + esc(shortText(Q)) + '</div>';
    if (x.ok) return h + '<div class="verdict ok">Correct</div></div>';
    h += '<div class="verdict no">Wrong</div><div class="wrote">You wrote <b>' + esc(x.wrote) + '</b>. The answer is <b>' + esc(correctText(Q)) + '</b>.</div><p class="how">How to get there:</p>' + workHtml(Q);
    return h + '</div>';
  }
  function reviewHtml(r, open) {
    var mine = state.results.slice(r * 6, r * 6 + 6), done = mine.filter(function (x) { return x; }), right = done.filter(function (x) { return x.ok; }).length;
    var secs = done.reduce(function (a, x) { return a + x.secs; }, 0);
    var sum = 'Round ' + (r + 1) + ' · ' + ROUND_NAMES[r] + ' · ' + right + ' of ' + (done.length === 6 ? 6 : done.length + ' answered') + (done.length ? ' · ' + fmtTime(secs) : '');
    var body = ''; for (var k = 0; k < 6; k++) body += reviewItem(r, k);
    return '<details class="review" data-round="' + (r + 1) + '"' + (open ? ' open' : '') + '><summary><span>' + sum + '</span></summary>' + body + '</details>';
  }
  function roundEnd() {
    clear(); state.screen = 'round';
    var mine = state.results.slice(state.r * 6, state.r * 6 + 6), right = mine.filter(function (x) { return x && x.ok; }).length, secs = Math.round((Date.now() - roundStart) / 1000);
    var card = el('div', 'card');
    card.appendChild(el('h2', null, 'Round ' + (state.r + 1) + ' done'));
    card.appendChild(el('div', 'score', right + ' of 6'));
    card.appendChild(el('p', 'small', 'Round time ' + Math.floor(secs / 60) + ' min ' + (secs % 60) + ' s. The time does not count for anything.'));
    card.appendChild(el('p', 'small', 'Open the summary to see how long each question took, and how to get to the answer for any you missed.'));
    card.insertAdjacentHTML('beforeend', reviewHtml(state.r, false));
    app.appendChild(card);
    var b = el('button', 'btn', state.r < 2 ? 'Start round ' + (state.r + 2) : 'See what to practise'); b.id = 'roundnext';
    b.onclick = function () { if (state.r < 2) { state.r++; beginRound(); } else final(); }; app.appendChild(b); b.focus();
  }
  function final() {
    clear(); state.screen = 'final';
    var done = state.results.filter(function (x) { return x; }), total = done.filter(function (x) { return x.ok; }).length;
    var card = el('div', 'card'); card.appendChild(el('h2', null, 'What to practise')); card.appendChild(el('div', 'score', total + ' of 18'));
    if (done.length < 18) card.appendChild(el('p', 'small', done.length + ' of 18 questions answered.'));
    Object.keys(CATS).forEach(function (c) {
      var all = state.qs.filter(function (Q) { return Q.cat === c; }).length, rs = done.filter(function (x) { return x.cat === c; }), ok = rs.filter(function (x) { return x.ok; }).length;
      card.appendChild(el('div', 'row', '<span><b>' + CATS[c] + '</b><br><span class="small">' + ok + ' of ' + all + (rs.length < all ? ' (' + (all - rs.length) + ' not reached)' : '') + '</span></span><span class="bar" aria-hidden="true"><i style="width:' + Math.round(100 * ok / all) + '%"></i></span>'));
    });
    app.appendChild(card);
    var rev = el('div', 'card'); rev.appendChild(el('h2', null, 'Every question'));
    rev.appendChild(el('p', 'small', 'Open a round to see the time for each question, what you wrote and how to get to each right answer.'));
    for (var rr = 0; rr < 3; rr++) rev.insertAdjacentHTML('beforeend', reviewHtml(rr, false));
    app.appendChild(rev);
    var tips = el('div', 'card'); tips.appendChild(el('h2', null, 'Your mistakes'));
    var counts = {}; done.forEach(function (x) { if (!x.ok) counts[x.tag] = (counts[x.tag] || 0) + 1; });
    var tags = Object.keys(counts);
    if (!tags.length) tips.appendChild(el('p', 'lead', done.length ? 'No mistakes. Every answer you gave was right.' : 'You did not answer any questions.'));
    else { var ul = el('ul', 'tips'); tags.forEach(function (t) { var n = counts[t]; ul.appendChild(el('li', null, '<b>' + n + (n === 1 ? ' time. ' : ' times. ') + '</b>' + esc(HABIT[t] || GENERIC))); }); tips.appendChild(ul); }
    tips.appendChild(el('p', 'small', 'Game code <span class="code">' + state.code + '</span>. Your teacher can open this file with #' + state.code + ' on the end of the address to see the same questions.'));
    app.appendChild(tips);
    var b = el('button', 'btn ghost', 'Play again'); b.id = 'again'; b.onclick = function () { fresh(); start(); }; app.appendChild(b); b.focus();
  }
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey || state.screen !== 'question') return;
    var Q = q();
    if (isMCQ(Q)) {
      if (/^[1-4]$/.test(e.key) && !locked) { e.preventDefault(); pressOpt(parseInt(e.key, 10) - 1); }
      else if (e.key === 'Enter' && locked) { e.preventDefault(); next(); }
      return;
    }
    if (/^[0-9]$/.test(e.key)) { e.preventDefault(); press(e.key); }
    else if (e.key === 'Backspace') { e.preventDefault(); press('back'); }
    else if (e.key === 'Enter') { e.preventDefault(); press('go'); }
  });
  window.__game = { generate: generate, newCode: newCode, questions: function () { return state.qs; }, code: function () { return state.code; }, display: display };
  fresh(fromHash()); start();
})();
</script>
</body>
</html>
