<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BIDMAS</title>
<style>
  :root {
    --navy: #2B2350; --coral: #EC6B58; --brick: #C0392B; --lav: #F2F0F8; --lav2: #E1DDEF;
    --ink: #1E1A3A; --soft: #5E5A70; --green: #1F7A48; --white: #fff; --blue: #1F6FB2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--white); color: var(--ink);
    font-family: Arial, Helvetica, sans-serif; -webkit-text-size-adjust: 100%; }
  body { min-height: 100vh; display: flex; justify-content: center; }
  #app { width: 100%; max-width: 780px; padding: 14px 16px 28px; }
  h1, h2 { font-family: Georgia, 'Times New Roman', serif; color: var(--navy); margin: 0; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .pill { background: var(--navy); color: var(--white); font-size: 12px; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; border-radius: 999px; padding: 7px 14px; white-space: nowrap; }
  .pill.hard { background: var(--brick); }
  .dots { display: flex; gap: 6px; }
  .dot { width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--navy); background: var(--white); }
  .dot.now { background: var(--lav2); }
  .dot.right { background: var(--green); border-color: var(--green); }
  .dot.wrong { background: var(--brick); border-color: var(--brick); }
  .card { background: var(--lav); border-radius: 14px; padding: 16px 16px; margin-bottom: 12px; }
  .ask { font-size: 19px; color: var(--navy); font-weight: 700; margin: 0 0 12px; line-height: 1.3; }
  .expr { background: var(--white); border-radius: 12px; padding: 16px 14px; font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700;
    color: var(--navy); text-align: center; line-height: 1.35; word-spacing: 2px; overflow-wrap: anywhere; }
  .expr.long { font-size: 28px; }
  .sub { font-size: 15px; color: var(--soft); margin: 10px 0 0; line-height: 1.35; }
  #answer { height: 64px; border: 3px solid var(--navy); border-radius: 12px; background: var(--white);
    font-size: 34px; font-weight: 700; color: var(--navy); display: flex; align-items: center; padding: 0 16px;
    margin-bottom: 12px; font-family: Arial, Helvetica, sans-serif; }
  #answer.empty { color: #9A96AE; font-weight: 400; font-size: 20px; font-family: Arial, sans-serif; }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  button { font: inherit; cursor: pointer; }
  .key { height: 60px; font-size: 28px; font-weight: 700; color: var(--navy); background: var(--white);
    border: 2px solid var(--lav2); border-radius: 12px; touch-action: manipulation; }
  .key:active { background: var(--lav2); }
  .key.fn { background: var(--lav); font-size: 22px; }
  .key.go, .btn { background: var(--navy); color: var(--white); border: 2px solid var(--navy); }
  .key.go { font-size: 20px; grid-column: 1 / -1; }
  .btn { padding: 15px 26px; border-radius: 12px; font-size: 18px; font-weight: 700; min-height: 54px; touch-action: manipulation; }
  .btn.ghost { background: var(--white); color: var(--navy); }
  .btn.small { padding: 8px 14px; font-size: 14px; min-height: 44px; }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible { outline: 3px solid var(--coral); outline-offset: 2px; }
  .opts { display: grid; gap: 10px; margin-bottom: 12px; }
  .opt { display: flex; align-items: center; gap: 14px; text-align: left; min-height: 60px; padding: 8px 16px; background: var(--white);
    border: 2px solid var(--lav2); border-radius: 12px; font-size: 24px; font-weight: 700; color: var(--navy); touch-action: manipulation; font-family: Arial, Helvetica, sans-serif; }
  .opt b { width: 34px; height: 34px; border-radius: 50%; background: var(--lav2); display: flex; align-items: center; justify-content: center; font-size: 17px; flex: none; font-family: Arial, sans-serif; }
  .opt span { overflow-wrap: anywhere; }
  .opt.correct { border-color: var(--green); background: #EAF6EF; } .opt.picked { border-color: var(--brick); background: #FDF0EE; }
  #feedback { border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; border: 3px solid; }
  #feedback.right { border-color: var(--green); background: #EAF6EF; }
  #feedback.wrong { border-color: var(--brick); background: #FDF0EE; }
  #feedback .head { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  #feedback.right .head { color: var(--green); } #feedback.wrong .head { color: var(--brick); }
  #feedback .msg { font-size: 17px; font-weight: 700; color: var(--navy); margin-bottom: 8px; }
  .how { font-size: 15px; color: var(--soft); margin: 6px 0 4px; line-height: 1.4; }
  .you { font-size: 16px; color: var(--navy); margin: 4px 0 8px; line-height: 1.4; font-family: Arial, Helvetica, sans-serif; }
  .work { font-size: 19px; font-family: Arial, Helvetica, sans-serif; color: var(--navy); font-weight: 700; line-height: 1.5; }
  .work div { margin: 2px 0; }
  .work .note { font-family: Arial, sans-serif; font-size: 13px; font-weight: 400; color: var(--soft); margin-left: 8px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--lav2); }
  .row:last-child { border-bottom: 0; }
  .bar { height: 12px; border-radius: 6px; background: var(--lav2); overflow: hidden; width: 140px; flex: none; }
  .bar i { display: block; height: 100%; background: var(--green); }
  .lead { font-size: 18px; line-height: 1.45; }
  .small { font-size: 13px; color: var(--soft); }
  .score { font-size: 44px; font-family: Georgia, serif; font-weight: 700; color: var(--navy); }
  ul.tips { padding-left: 20px; margin: 8px 0 0; } ul.tips li { margin: 8px 0; font-size: 17px; line-height: 1.4; }
  .code { font-family: 'Courier New', monospace; font-weight: 700; letter-spacing: .12em; color: var(--navy); }
  details.review { border: 2px solid var(--lav2); border-radius: 12px; background: var(--white); margin: 10px 0 0; }
  details.review > summary { cursor: pointer; padding: 12px 14px; font-weight: 700; color: var(--navy); font-size: 16px; line-height: 1.35; list-style: none; display: flex; justify-content: space-between; gap: 10px; align-items: center; min-height: 48px; }
  details.review > summary::-webkit-details-marker { display: none; }
  details.review > summary::after { content: '▾'; font-size: 18px; flex: none; transition: transform .15s; }
  details.review[open] > summary::after { transform: rotate(180deg); }
  details.review > summary:focus-visible { outline: 3px solid var(--coral); outline-offset: 2px; }
  .rq { padding: 12px 14px; border-top: 1px solid var(--lav2); }
  .rq .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .rq .qn { font-weight: 700; color: var(--navy); font-size: 15px; }
  .rq .meta { font-size: 14px; color: var(--soft); white-space: nowrap; }
  .rq .verdict { font-weight: 700; font-size: 15px; }
  .rq .verdict.ok { color: var(--green); } .rq .verdict.no { color: var(--brick); } .rq .verdict.na { color: var(--soft); }
  .rq .txt { font-size: 16px; line-height: 1.4; margin: 4px 0; font-family: Arial, Helvetica, sans-serif; overflow-wrap: anywhere; }
  .rq .wrote { font-size: 15px; margin: 6px 0 2px; color: var(--navy); }
  .rq .work { font-size: 17px; }
  .hide { display: none !important; }
  @media (max-width: 480px) {
    .ask { font-size: 17px; } .expr { font-size: 26px; padding: 12px 8px; } .expr.long { font-size: 21px; }
    .key { height: 56px; } #answer { height: 58px; font-size: 30px; } .bar { width: 80px; } .opt { font-size: 19px; }
    .work { font-size: 17px; }
  }
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<script>
(function () {
  'use strict';

  /* ================================================================== *
   * BIDMAS. Nobody gets the same game.
   *
   * Every question is built from a template with random numbers, all from a six-character game
   * code that is different for each student. Opening the file with #CODE after the address gives
   * the same game again. The SKILLS and their order are the same for everyone, so the diagnostic
   * at the end means the same thing for every student.
   *
   * An expression is a flat list of tokens: numbers (a negative number is just a negative value,
   * drawn with brackets where needed), + − × ÷, brackets, and a power (² or ³) that belongs to the
   * number or bracket in front of it. ONE stepper does one operation at a time and rewrites the
   * whole expression after each, which is the working shown to the student. The same stepper,
   * given a WRONG rule (add before multiplying, strictly left to right, brackets ignored,
   * 5² read as 5 × 2 ...), produces the mistake a student probably made, and the working that
   * gives it. build/check-bidmas-game.py re-derives every answer with sympy and every mistake with
   * its own, separate evaluator.
   *
   * DIFFICULTY RAMPS, AND THE END IS MEANT TO BE HARD. Round 1: multiply and divide before add and
   * subtract, one pair of brackets. Round 2: powers, and same-rank operations worked left to
   * right. Round 3 goes far past the lesson: nested brackets, negative numbers, brackets placed
   * to hit a target, a missing number, and two questions meant to be almost impossible (a long mix
   * of everything; the largest value one pair of brackets can make; a missing number that is
   * squared). A student who fails them still gets the working.
   * ================================================================== */
  var ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  function newCode() {
    var out = '', bytes = new Uint8Array(6);
    if (window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(bytes);
    else for (var k = 0; k < 6; k++) bytes[k] = Math.floor(Math.random() * 256);
    for (var i = 0; i < 6; i++) out += ALPHABET[bytes[i] % ALPHABET.length];
    return out;
  }
  function validCode(c) { return typeof c === 'string' && /^[A-HJ-NP-Z2-9]{6}$/.test(c); }
  function makeRng(code) {
    var h = 1779033703 ^ code.length;
    for (var i = 0; i < code.length; i++) { h = Math.imul(h ^ code.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
    var a = (h ^ (h >>> 16)) >>> 0;
    return function () { a = (a + 0x6D2B79F5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  /* ---------- tokens ---------- */
  var MINUS = '−';
  function E() {                                    // E(3, '+', 4, '×', '(', 5, '−', 1, ')', '²')
    var out = [];
    for (var i = 0; i < arguments.length; i++) {
      var a = arguments[i];
      if (typeof a === 'number') out.push({ k: 'n', v: a });
      else if (a === '(') out.push({ k: 'l' });
      else if (a === ')') out.push({ k: 'r' });
      else if (a === '²') out.push({ k: 'p', v: 2 });
      else if (a === '³') out.push({ k: 'p', v: 3 });
      else if (a === '?') out.push({ k: 'q' });
      else out.push({ k: 'o', v: a });
    }
    return out;
  }
  function text(ts) {
    var s = '';
    for (var i = 0; i < ts.length; i++) {
      var t = ts[i];
      if (t.k === 'n') {
        if (t.v < 0) { var bare = (i === 0 || ts[i - 1].k === 'l') && !(ts[i + 1] && ts[i + 1].k === 'p'); s += bare ? MINUS + (-t.v) : '(' + MINUS + (-t.v) + ')'; }
        else s += String(t.v);
      }
      else if (t.k === 'o') s += ' ' + t.v + ' ';
      else if (t.k === 'l') s += '('; else if (t.k === 'r') s += ')';
      else if (t.k === 'p') s += t.v === 2 ? '²' : '³';
      else if (t.k === 'q') s += '?';
    }
    return s;
  }
  function ascii(ts) {
    var s = '';
    ts.forEach(function (t) {
      if (t.k === 'n') s += t.v < 0 ? '(' + t.v + ')' : String(t.v);
      else if (t.k === 'o') s += t.v === '×' ? '*' : t.v === '÷' ? '/' : t.v === MINUS ? '-' : '+';
      else if (t.k === 'l') s += '('; else if (t.k === 'r') s += ')';
      else if (t.k === 'p') s += '**' + t.v;
      else if (t.k === 'q') s += 'x';
    });
    return s;
  }
  function subst(ts, x) { return ts.map(function (t) { return t.k === 'q' ? { k: 'n', v: x } : t; }); }

  /* ---------- the stepper, with the rules a student might (wrongly) follow ---------- */
  var NORMAL = { p: 0, '×': 1, '÷': 1, '+': 2 }; NORMAL[MINUS] = 2;
  function PR(o) { var r = { p: 0, '×': 1, '÷': 1, '+': 2 }; r[MINUS] = 2; for (var k in o) r[k] = o[k]; return r; }
  var RULES = {
    normal:       { pr: NORMAL },
    addfirst:     { pr: PR({ '×': 2, '÷': 2, '+': 1, [MINUS]: 1 }) },
    ltr:          { pr: PR({ '×': 1, '÷': 1, '+': 1, [MINUS]: 1 }) },
    mulfirst:     { pr: PR({ '×': 1, '÷': 2, '+': 3, [MINUS]: 3 }) },
    addbeforesub: { pr: PR({ '+': 2, [MINUS]: 3 }) },
    powwhole:     { pr: PR({ p: 1.5 }) },
    nobracket:    { pr: NORMAL, nobr: true },
    nopow:        { pr: NORMAL, nopow: true },
    negsq:        { pr: NORMAL, negsq: true },
    negmul:       { pr: NORMAL, negmul: true },
    signs:        { pr: NORMAL, signs: true }
  };
  var MISTAKE_ORDER = ['nobracket', 'addfirst', 'ltr', 'mulfirst', 'addbeforesub', 'powwhole', 'nopow', 'negsq', 'negmul', 'signs'];
  var OPNAME = { '×': 'multiply', '÷': 'divide', '+': 'add' }; OPNAME[MINUS] = 'subtract';
  var LIMIT = 99999;

  function prep(ts, rule) {
    if (rule.nobr) ts = ts.filter(function (t) { return t.k !== 'l' && t.k !== 'r'; });
    if (rule.nopow) { var o = []; ts.forEach(function (t) { if (t.k === 'p') { o.push({ k: 'o', v: '×' }); o.push({ k: 'n', v: t.v }); } else o.push(t); }); ts = o; }
    return ts;
  }
  function applyOp(op, a, b, rule) {
    var v;
    if (op === '+') v = rule.signs && b < 0 ? a + Math.abs(b) : a + b;
    else if (op === MINUS) v = rule.signs && b < 0 ? a - Math.abs(b) : a - b;
    else if (op === '×') { v = a * b; if (rule.negmul && a < 0 && b < 0) v = -Math.abs(v); }
    else { if (b === 0 || a % b !== 0) return null; v = a / b; if (rule.negmul && a < 0 && b < 0) v = -Math.abs(v); }
    if (v === 0) v = 0;
    return Math.abs(v) > LIMIT ? null : v;
  }
  // One step. Returns {ts, note}, 'done', or null (stuck or not a whole number).
  function step(ts, rule) {
    var j = -1, i, k;
    for (k = 0; k < ts.length; k++) if (ts[k].k === 'r') { j = k; break; }
    var lo = 0, hi = ts.length;
    if (j >= 0) { for (k = j - 1; k >= 0; k--) if (ts[k].k === 'l') { i = k; break; } lo = i + 1; hi = j; }
    var best = -1, bp = 1e9;
    for (k = lo; k < hi; k++) {
      var t = ts[k], p = null;
      if (t.k === 'p') { if (k - 1 >= lo && ts[k - 1].k === 'n') p = rule.pr.p; }
      else if (t.k === 'o') { if (k - 1 >= lo && k + 1 < hi && ts[k - 1].k === 'n' && ts[k + 1].k === 'n') p = rule.pr[t.v]; }
      if (p !== null && p < bp) { bp = p; best = k; }
    }
    if (best < 0) {
      if (hi - lo === 1 && ts[lo].k === 'n') {
        if (j < 0) return 'done';
        return { ts: ts.slice(0, i).concat([ts[lo]], ts.slice(j + 1)), note: 'brackets done' };
      }
      return null;
    }
    var t2 = ts[best], v, note, from, to;
    if (t2.k === 'p') {
      var b0 = ts[best - 1].v; v = (rule.negsq && b0 < 0) ? -Math.pow(Math.abs(b0), t2.v) : Math.pow(b0, t2.v);
      if (Math.abs(v) > LIMIT) return null;
      note = 'powers'; from = best - 1; to = best + 1;
    } else {
      v = applyOp(t2.v, ts[best - 1].v, ts[best + 1].v, rule); if (v === null) return null;
      note = OPNAME[t2.v]; from = best - 1; to = best + 2;
    }
    var out = ts.slice(0, from).concat([{ k: 'n', v: v }], ts.slice(to));
    if (j >= 0) { var nj = j - (to - from) + 1; if (nj - i === 2) out = out.slice(0, i).concat([out[i + 1]], out.slice(nj + 1)); note = 'in the brackets: ' + note; }
    return { ts: out, note: note };
  }
  // The whole working. lines[0] is the expression as written.
  function chain(ts0, rule) {
    var ts = ts0, lines = [text(ts0)], notes = [''], allNeg = false;
    var pr = prep(ts0, rule);
    if (pr.length !== ts0.length || pr.some(function (t, i) { return t !== ts0[i]; })) { ts = pr; lines.push(text(ts)); notes.push(rule.nobr ? 'brackets ignored' : 'power read as times'); }
    for (var n = 0; n < 40; n++) {
      var s = step(ts, rule);
      if (s === 'done') { var v = ts.length === 1 && ts[0].k === 'n' ? ts[0].v : null; if (v === null) return null; return { value: v, lines: lines, notes: notes, usedNeg: allNeg }; }
      if (s === null) return null;
      ts = s.ts; lines.push(text(ts)); notes.push(s.note);
      if (ts.some(function (t) { return t.k === 'n' && t.v < 0; })) allNeg = true;
    }
    return null;
  }
  function evalRule(ts, rule) { var c = chain(ts, rule); return c ? c.value : null; }

  var MSG = {
    nobracket: 'Brackets come first. Work out what is inside them before anything else.',
    addfirst: 'You added or subtracted before multiplying or dividing. Multiply and divide come first.',
    ltr: 'You worked strictly left to right. Multiply and divide come before add and subtract.',
    mulfirst: 'Multiply and divide have equal rank. Go left to right: if the divide comes first, do it first.',
    addbeforesub: 'Add and subtract have equal rank. Go left to right: do not add first just because it is a +.',
    powwhole: 'A power only belongs to the number or bracket directly in front of it. Do the power first.',
    nopow: 'A power is repeated multiplication. 5² means 5 × 5, not 5 × 2.',
    negsq: 'A negative number squared is positive. (−3)² = (−3) × (−3) = 9.',
    negmul: 'A negative times a negative is positive.',
    signs: 'Watch the signs. Subtracting a negative adds. Adding a negative takes away.',
    nobrackets: 'You need to use the brackets. Try each position and work out the value every time.',
    notmax: 'That value is possible, but it is not the largest. Try every position for the brackets.',
    place: 'That placement gives a different value. Work each one out with BIDMAS.'
  };

  function nt(v) { return v < 0 ? MINUS + (-v) : String(v); }
  function mistakes(ts, answer) {
    var out = {}, seen = {};
    MISTAKE_ORDER.forEach(function (name) {
      var c = chain(ts, RULES[name]); if (!c) return;
      var v = c.value;
      if (v === answer || seen[v] || Math.abs(v) > LIMIT) return;
      seen[v] = 1; out[String(v)] = { tag: name, rule: name, how: c.lines.join(' = '), msg: MSG[name] };
    });
    return out;
  }
  function evalQ(cat, ts, o) {
    o = o || {};
    if (!ts) return null;
    var c = chain(ts, RULES.normal); if (!c) return null;
    var ans = c.value;
    if (o.pos && (c.usedNeg || ans < 1)) return null;
    if (Math.abs(ans) > 9999) return null;
    var wrong = mistakes(ts, ans);
    if (!Object.keys(wrong).length) return null;
    return { cat: cat, kind: 'eval', expr: text(ts), ascii: ascii(ts), answer: ans, worked: c.lines.slice(1).map(function (l) { return '= ' + l; }), notes: c.notes.slice(1), wrong: wrong };
  }
  // Every way to put ONE pair of brackets round two or more of the numbers (not round the lot).
  function bracketPlacements(nums, ops) {
    var out = [], n = nums.length;
    for (var i = 0; i < n; i++) for (var j = i + 1; j < n; j++) {
      if (i === 0 && j === n - 1) continue;
      var ts = [];
      for (var k = 0; k < n; k++) {
        if (k === i) ts.push({ k: 'l' });
        ts.push({ k: 'n', v: nums[k] });
        if (k === j) ts.push({ k: 'r' });
        if (k < n - 1) ts.push({ k: 'o', v: ops[k] });
      }
      var v = evalRule(ts, RULES.normal);
      if (v !== null) out.push({ i: i, j: j, ts: ts, v: v });
    }
    return out;
  }
  function plainTs(nums, ops) { var ts = []; nums.forEach(function (x, k) { ts.push({ k: 'n', v: x }); if (k < ops.length) ts.push({ k: 'o', v: ops[k] }); }); return ts; }

  function generate(code) {
    var rnd = makeRng(code);
    var int = function (a, b) { return a + Math.floor(rnd() * (b - a + 1)); };
    var pick = function (arr) { return arr[Math.floor(rnd() * arr.length)]; };
    var shuffle = function (arr) { var r = arr.slice(); for (var i = r.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)); var t = r[i]; r[i] = r[j]; r[j] = t; } return r; };
    var until = function (f) { for (var t = 0; t < 20000; t++) { var r = f(); if (r) return r; } throw new Error('generator stuck'); };
    var T = function (cat, build, o) { return function () { return until(function () { return evalQ(cat, build(), o); }); }; };
    var X = '×', D = '÷', SQ = '²', CU = '³', M = MINUS;

    /* ---------- Round 1: the basics ---------- */
    var R1 = {
      addMul: T('md', function () { return E(int(2, 12), '+', int(2, 9), X, int(2, 9)); }, { pos: true }),
      subMul: T('md', function () { var b = int(2, 6), c = int(2, 6); return E(b * c + int(2, 15), M, b, X, c); }, { pos: true }),
      addDiv: T('md', function () { var c = int(2, 6), b = c * int(2, 9); return E(int(3, 15), '+', b, D, c); }, { pos: true }),

    locked = true;
    var fb = document.getElementById('feedback'); fb.className = ok ? 'right' : 'wrong'; fb.innerHTML = feedbackHtml(Q, head, msg, how);
    var last = state.i === 5, label = last ? (state.r === 2 ? 'See results' : 'Finish round') : 'Next';
    var goBtn = document.querySelector('.key.go') || document.getElementById('nextbtn');
    goBtn.textContent = label; goBtn.classList.remove('hide');
    document.querySelectorAll('.dot')[state.i].className = 'dot ' + (ok ? 'right' : 'wrong');
    fb.scrollIntoView({ block: 'nearest' });
  }
  function next() { if (state.i < 5) { state.i++; question(); } else roundEnd(); }

  /* ---------- the review: a drop-down for a round, with the time for each question, right or wrong,
   *            and for a wrong answer what the student wrote and how to get to the right one ---------- */
  function fmtTime(secs) { return secs < 60 ? secs + ' s' : Math.floor(secs / 60) + ' min ' + (secs % 60) + ' s'; }
  function reviewItem(r, k) {
    var Q = state.qs[r * 6 + k], x = state.results[r * 6 + k], n = r * 6 + k + 1;
    var h = '<div class="rq" data-q="' + n + '"><div class="top"><span class="qn">Question ' + n + '</span>';
    if (!x) return h + '<span class="verdict na">Not reached</span></div><div class="txt">' + esc(shortText(Q)) + '</div></div>';
    h += '<span class="meta">' + fmtTime(x.secs) + '</span></div><div class="txt">' + esc(shortText(Q)) + '</div>';
    if (x.ok) return h + '<div class="verdict ok">Correct</div></div>';
    h += '<div class="verdict no">Wrong</div><div class="wrote">You wrote <b>' + esc(x.wrote) + '</b>. The answer is <b>' + esc(rightText(Q)) + '</b>.</div>';
    h += (Q.method ? '<p class="how">' + esc(Q.method) + '</p>' : '') + '<p class="how">How to get there. Follow BIDMAS, one step at a time:</p>' + workHtml(Q);
    return h + '</div>';
  }
  function reviewHtml(r, open) {
    var mine = state.results.slice(r * 6, r * 6 + 6), done = mine.filter(function (x) { return x; }), right = done.filter(function (x) { return x.ok; }).length;
    var secs = done.reduce(function (a, x) { return a + x.secs; }, 0);
    var sum = 'Round ' + (r + 1) + ' · ' + ROUND_NAMES[r] + ' · ' + right + ' of ' + (done.length === 6 ? 6 : done.length + ' answered') + (done.length ? ' · ' + fmtTime(secs) : '');
    var body = ''; for (var k = 0; k < 6; k++) body += reviewItem(r, k);
    return '<details class="review" data-round="' + (r + 1) + '"' + (open ? ' open' : '') + '><summary><span>' + sum + '</span></summary>' + body + '</details>';
  }
  function roundEnd() {
    clear(); state.screen = 'round';
    var mine = state.results.slice(state.r * 6, state.r * 6 + 6);
    var right = mine.filter(function (x) { return x && x.ok; }).length;
    var secs = Math.round((Date.now() - roundStart) / 1000);
    var card = el('div', 'card');
    card.appendChild(el('h2', null, 'Round ' + (state.r + 1) + ' done'));
    card.appendChild(el('div', 'score', right + ' of 6'));
    card.appendChild(el('p', 'small', 'Round time ' + Math.floor(secs / 60) + ' min ' + (secs % 60) + ' s. The time does not count for anything.'));
    card.appendChild(el('p', 'small', 'Open the summary to see how long each question took, and how to get to the answer for any you missed.'));
    card.insertAdjacentHTML('beforeend', reviewHtml(state.r, false));
    app.appendChild(card);
    var b = el('button', 'btn', state.r < 2 ? 'Start round ' + (state.r + 2) : 'See what to practise'); b.id = 'roundnext';
    b.onclick = function () { if (state.r < 2) { state.r++; beginRound(); } else final(); };
    app.appendChild(b); b.focus();
  }
  function final() {
    clear(); state.screen = 'final';
    var done = state.results.filter(function (x) { return x; }), total = done.filter(function (x) { return x.ok; }).length;
    var card = el('div', 'card');
    card.appendChild(el('h2', null, 'What to practise'));
    card.appendChild(el('div', 'score', total + ' of 18'));
    if (done.length < 18) card.appendChild(el('p', 'small', done.length + ' of 18 questions answered.'));
    Object.keys(CATS).forEach(function (c) {
      var all = state.qs.filter(function (Q) { return Q.cat === c; }).length;
      var rs = done.filter(function (x) { return x.cat === c; }), ok = rs.filter(function (x) { return x.ok; }).length;
      card.appendChild(el('div', 'row', '<span><b>' + CATS[c] + '</b><br><span class="small">' + ok + ' of ' + all + (rs.length < all ? ' (' + (all - rs.length) + ' not reached)' : '') + '</span></span>' +
        '<span class="bar" aria-hidden="true"><i style="width:' + Math.round(100 * ok / all) + '%"></i></span>'));
    });
    app.appendChild(card);
    var rev = el('div', 'card'); rev.appendChild(el('h2', null, 'Every question'));
    rev.appendChild(el('p', 'small', 'Open a round to see the time for each question, what you wrote and how to get to each right answer.'));
    for (var rr = 0; rr < 3; rr++) rev.insertAdjacentHTML('beforeend', reviewHtml(rr, false));
    app.appendChild(rev);
    var tips = el('div', 'card'); tips.appendChild(el('h2', null, 'Your mistakes'));
    var counts = {};
    done.forEach(function (x) { if (!x.ok) counts[x.tag] = (counts[x.tag] || 0) + 1; });
    var tags = Object.keys(counts);
    if (!tags.length) tips.appendChild(el('p', 'lead', done.length ? 'No mistakes. Every answer you gave was right.' : 'You did not answer any questions.'));
    else {
      var ul = el('ul', 'tips');
      tags.forEach(function (t) {
        var n = counts[t], text = t === 'other' ? 'Some answers did not match a common mistake. Look back at the working shown after each one.' : (HABIT[t] || GENERIC);
        ul.appendChild(el('li', null, '<b>' + n + (n === 1 ? ' time. ' : ' times. ') + '</b>' + esc(text)));
      });
      tips.appendChild(ul);
    }
    tips.appendChild(el('p', 'small', 'Game code <span class="code">' + state.code + '</span>. Your teacher can open this file with #' + state.code + ' on the end of the address to see the same questions.'));
    app.appendChild(tips);
    var b = el('button', 'btn ghost', 'Play again'); b.id = 'again'; b.onclick = function () { fresh(); start(); }; app.appendChild(b);
    b.focus();
  }

  /* ---------- keyboard: digits, minus, Backspace, Enter; 1 to 4 for the multiple choice ---------- */
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (state.screen !== 'question') return;
    var Q = q();
    if (isMCQ(Q)) {
      if (/^[1-4]$/.test(e.key) && !locked) { e.preventDefault(); pressOpt(parseInt(e.key, 10) - 1); }
      else if (e.key === 'Enter' && locked) { e.preventDefault(); next(); }
      return;
    }
    if (/^[0-9]$/.test(e.key)) { e.preventDefault(); press(e.key); }
    else if (e.key === '-') { e.preventDefault(); press('neg'); }
    else if (e.key === 'Backspace') { e.preventDefault(); press('back'); }
    else if (e.key === 'Enter') { e.preventDefault(); press('go'); }
  });

  window.__game = { generate: generate, newCode: newCode, questions: function () { return state.qs; }, code: function () { return state.code; }, display: display };   // read by the test script only
  fresh(fromHash()); start();
})();
</script>
</body>
</html>
