<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sustainable Yield</title>
<style>
  :root {
    --earth: #3D2B1F; --gold: #C99A3D; --goldink: #8F6D2A; --slate: #6A8C9A; --terra: #B5482E; --sand: #F2EBDD; --sand2: #E4D8BE;
    --ink: #2A1D14; --soft: #6B5A48; --green: #1F7A48; --white: #fff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--sand); color: var(--ink); font-family: Arial, Helvetica, sans-serif; -webkit-text-size-adjust: 100%; }
  body { min-height: 100vh; display: flex; justify-content: center; }
  #app { width: 100%; max-width: 820px; padding: 14px 16px 28px; }
  h1, h2 { font-family: Georgia, 'Times New Roman', serif; color: var(--earth); margin: 0; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .pill { background: var(--earth); color: var(--white); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; border-radius: 999px; padding: 7px 14px; white-space: nowrap; }
  .pill.hard { background: var(--terra); }
  .dots { display: flex; gap: 6px; }
  .dot { width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--earth); background: var(--white); }
  .dot.now { background: var(--sand2); } .dot.right { background: var(--green); border-color: var(--green); } .dot.wrong { background: var(--terra); border-color: var(--terra); }
  .card { background: var(--white); border: 2px solid var(--sand2); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .ask { font-size: 19px; color: var(--earth); font-weight: 700; margin: 0 0 12px; line-height: 1.35; }
  .ask small { display: block; font-size: 15px; font-weight: 400; color: var(--soft); margin-top: 6px; }
  .sub { font-size: 15px; color: var(--soft); margin: 8px 0 0; line-height: 1.4; }
  .unit { font-size: 15px; color: var(--soft); margin: -6px 0 10px; }
  button { font: inherit; cursor: pointer; }
  .btn { padding: 15px 26px; border-radius: 12px; font-size: 18px; font-weight: 700; min-height: 54px; touch-action: manipulation; background: var(--earth); color: var(--white); border: 2px solid var(--earth); }
  .btn.ghost { background: var(--white); color: var(--earth); } .btn.small { padding: 8px 14px; font-size: 14px; min-height: 44px; }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, summary:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .opts { display: grid; gap: 10px; margin-bottom: 12px; }
  .opt { display: flex; align-items: center; gap: 12px; text-align: left; min-height: 58px; padding: 8px 14px; background: var(--white); border: 2px solid var(--sand2); border-radius: 12px; font-size: 17px; font-weight: 700; color: var(--earth); touch-action: manipulation; line-height: 1.3; }
  .opt b { width: 32px; height: 32px; border-radius: 50%; background: var(--sand2); display: flex; align-items: center; justify-content: center; font-size: 16px; flex: none; }
  .opt.correct { border-color: var(--green); background: #EAF6EF; } .opt.picked { border-color: var(--terra); background: #FBEAE6; }
  #feedback { border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; border: 3px solid; }
  #feedback.right { border-color: var(--green); background: #EAF6EF; } #feedback.wrong { border-color: var(--terra); background: #FBEAE6; }
  #feedback .head { font-size: 21px; font-weight: 700; margin-bottom: 6px; } #feedback.right .head { color: var(--green); } #feedback.wrong .head { color: var(--terra); }
  #feedback .msg { font-size: 17px; font-weight: 700; color: var(--earth); margin-bottom: 8px; }
  .how { font-size: 15px; color: var(--soft); margin: 6px 0 2px; }
  .work { font-size: 17px; color: var(--earth); font-weight: 700; line-height: 1.5; } .work div { margin: 2px 0; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--sand2); }
  .row:last-child { border-bottom: 0; }
  .bar { height: 12px; border-radius: 6px; background: var(--sand2); overflow: hidden; width: 140px; flex: none; } .bar i { display: block; height: 100%; background: var(--green); }
  .lead { font-size: 18px; line-height: 1.45; } .small { font-size: 13px; color: var(--soft); }
  .score { font-size: 44px; font-family: Georgia, serif; font-weight: 700; color: var(--earth); }
  ul.tips { padding-left: 20px; margin: 8px 0 0; } ul.tips li { margin: 8px 0; font-size: 17px; line-height: 1.4; }
  .code { font-family: 'Courier New', monospace; font-weight: 700; letter-spacing: .12em; color: var(--earth); }
  details.review { border: 2px solid var(--sand2); border-radius: 12px; background: var(--white); margin: 10px 0 0; }
  details.review > summary { cursor: pointer; padding: 12px 14px; font-weight: 700; color: var(--earth); font-size: 16px; line-height: 1.35; list-style: none; display: flex; justify-content: space-between; gap: 10px; align-items: center; min-height: 48px; }
  details.review > summary::-webkit-details-marker { display: none; } details.review > summary::after { content: '▾'; font-size: 18px; flex: none; }
  details.review[open] > summary::after { transform: rotate(180deg); }
  .rq { padding: 12px 14px; border-top: 1px solid var(--sand2); }
  .rq .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .rq .qn { font-weight: 700; color: var(--earth); font-size: 15px; } .rq .meta { font-size: 14px; color: var(--soft); white-space: nowrap; }
  .rq .verdict { font-weight: 700; font-size: 15px; } .verdict.ok { color: var(--green); } .verdict.no { color: var(--terra); } .verdict.na { color: var(--soft); }
  .rq .txt { font-size: 15px; line-height: 1.4; margin: 4px 0; } .rq .wrote { font-size: 15px; margin: 6px 0 2px; color: var(--earth); }
  .hide { display: none !important; }
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<script>
(function () {
  'use strict';

  /* ================================================================== *
   * SUSTAINABLE YIELD. Nobody gets the same game.
   *
   * Every question is built from a template with random stocks, growth rates and amounts taken,
   * from a game code that is different for each student. Opening the file with #CODE after the
   * address gives the same game again, so a teacher can see exactly what a student saw. The
   * SKILLS and their order are the same for everyone, so the diagnostic at the end means the same
   * thing for every student.
   *
   * Round 1 is the sustainable yield calculation itself: stock times growth rate. Round 2 adds
   * what was actually taken, and asks whether the stock grows, shrinks, or stays the same. EVERY
   * OUTCOME IS CONSTRUCTED, not threshold-checked after the fact: the amount taken is chosen to be
   * strictly below, strictly above, or exactly equal to the sustainable yield, so the category is
   * never a coincidence. Round 3 is harder numbers, plus management-method reasoning. The last
   * two questions are drawn from a small pool of very hard templates. A student who fails them
   * still gets the working.
   * ================================================================== */
  var ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  function newCode() {
    var out = '', bytes = new Uint8Array(6);
    if (window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(bytes);
    else for (var k = 0; k < 6; k++) bytes[k] = Math.floor(Math.random() * 256);
    for (var i = 0; i < 6; i++) out += ALPHABET[bytes[i] % ALPHABET.length];
    return out;
  }
  function validCode(c) { return typeof c === 'string' && /^[A-HJ-NP-Z2-9]{6}$/.test(c); }
  function makeRng(code) {
    var h = 1779033703 ^ code.length;
    for (var i = 0; i < code.length; i++) { h = Math.imul(h ^ code.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
    var a = (h ^ (h >>> 16)) >>> 0;
    return function () { a = (a + 0x6D2B79F5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  var RESOURCES = [
    { name: 'a fish stock', unit: 'tonnes' }, { name: 'a forest', unit: 'hectares' }, { name: 'a deer herd', unit: 'deer' },
    { name: 'a lobster population', unit: 'tonnes' }, { name: 'a timber plantation', unit: 'hectares' }, { name: 'a whale population', unit: 'whales' },
  ];
  var VERB = { 'tonnes': 'caught', 'hectares': 'cut', 'deer': 'hunted', 'whales': 'taken' };
  var GSS_TEXT = ['The stock grows', 'The stock shrinks', 'The stock stays the same', 'Not enough information'];
  var METHOD_SCENARIOS = [
    { text: 'A fish stock has been caught faster than it can breed for years, and numbers are falling fast.', correct: 'A catch quota set below the sustainable yield',
      options: ['A catch quota set below the sustainable yield', 'Fishing more boats at once to catch them before they run out', 'Recycling fishing nets', 'Measuring the water temperature more often'],
      msgFor: { 'Fishing more boats at once to catch them before they run out': 'That makes the problem worse: it increases how much is taken, not less.', 'Recycling fishing nets': 'That does not change how many fish are caught.', 'Measuring the water temperature more often': 'That is useful data, but it does not manage how many fish are taken.' } },
    { text: 'A metal is non-renewable, and new products keep needing more of it.', correct: 'Recycling the metal already in use',
      options: ['Recycling the metal already in use', 'A closed season', 'Replanting', 'A breeding programme'],
      msgFor: { 'A closed season': 'That is for a living resource that can breed back, like fish. A metal does not regrow.', 'Replanting': 'That is for living resources like forests, not metal.', 'A breeding programme': 'That is for animal populations, not metal.' } },
    { text: 'A forest has been cut faster than it regrows, and the total area of trees is shrinking.', correct: 'Replanting trees at least as fast as they are cut',
      options: ['Replanting trees at least as fast as they are cut', 'Recycling', 'A fishing quota', 'A breeding programme'],
      msgFor: { 'Recycling': 'Recycling reduces the need for NEW material. It does not replace a specific area of forest.', 'A fishing quota': 'That manages a fish stock, not a forest.', 'A breeding programme': 'That is for animal populations, not a forest.' } },
    { text: 'A wild animal population has fallen very low, and breeding naturally is too slow to rebuild it quickly.', correct: 'A breeding programme to raise young and release them',
      options: ['A breeding programme to raise young and release them', 'Recycling', 'Mining the area more carefully', 'A measuring cylinder with finer markings'],
      msgFor: { 'Recycling': 'That does not apply to a living population.', 'Mining the area more carefully': 'That is for a mineral resource, not an animal population.', 'A measuring cylinder with finer markings': 'That is about measuring precision, not managing a population.' } },
  ];

  function generate(code) {
    var rnd = makeRng(code);
    var pick = function (arr) { return arr[Math.floor(rnd() * arr.length)]; };
    var shuffle = function (arr) { var r = arr.slice(); for (var i = r.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)); var t = r[i]; r[i] = r[j]; r[j] = t; } return r; };
    var Q = function (cat, kind, o) { o.cat = cat; o.kind = kind; return o; };
    var comma = function (n) { return n.toLocaleString(); };

    /* ---------------- Round 1: find the sustainable yield ---------------- */
    function yieldQ() {
      var r = pick(RESOURCES);
      var stock = pick([80, 100, 120, 150, 180, 200, 250, 300, 350, 400]) * 1000;
      var rate = pick([2, 3, 4, 5, 6, 8, 10, 12]);
      var yld = stock * rate / 100;
      var wrong1 = stock / rate;
      var wrong2 = stock * (rate + 1) / 100;
      var wrong3 = yld * 10;
      var opts = [yld, wrong1, wrong2, wrong3];
      var seen = {}; opts = opts.filter(function (o) { var k2 = Math.round(o); if (seen[k2]) return false; seen[k2] = 1; return true; });
      while (opts.length < 4) opts.push(yld + opts.length * 777);
      var options = shuffle(opts).map(function (o) { return { text: comma(Math.round(o)) + ' ' + r.unit, tag: o === yld ? null : 'yield', msg: o === yld ? '' : 'Multiply the stock by the growth rate as a percentage: stock × rate ÷ 100.' }; });
      var ci = options.map(function (o) { return o.tag === null; }).indexOf(true);
      return Q('yield', 'yield', { prompt: comma(stock) + ' ' + r.unit + ' of ' + r.name.replace('a ', '') + ', growing by ' + rate + '% a year. Calculate the maximum sustainable amount that can be taken each year.',
        stock: stock, rate: rate, unit: r.unit, options: options, correctIndex: ci,
        explain: [comma(stock) + ' × ' + rate + ' ÷ 100 = ' + comma(Math.round(yld)) + ' ' + r.unit + '.'] });
    }

    /* ---------------- Round 2 / part of Round 3: grows, shrinks, or stays the same ---------------- */
    function gssQ(category, hard) {
      var r = pick(RESOURCES);
      var stock = pick(hard ? [220, 260, 340, 380, 420, 460] : [80, 100, 120, 150, 180, 200]) * 1000;
      var rate = pick([2, 4, 5, 6, 8, 10]);
      var yld = Math.round(stock * rate / 100);
      var taken, correct, tag;
      if (category === 'grows') { taken = yld - pick([500, 1000, 1500, 2000]); correct = 'The stock grows'; tag = 'below'; }
      else if (category === 'shrinks') { taken = yld + pick([500, 1000, 1500, 2000]); correct = 'The stock shrinks'; tag = 'above'; }
      else { taken = yld; correct = 'The stock stays the same'; tag = 'equal'; }
      var msgFor = function (opt) {
        if (opt === 'Not enough information') return 'The sustainable yield is ' + comma(yld) + ' ' + r.unit + ', and ' + comma(taken) + ' ' + r.unit + ' are ' + VERB[r.unit] + '. That is enough to decide.';
        return 'The sustainable yield is ' + comma(yld) + ' ' + r.unit + ' (' + comma(stock) + ' × ' + rate + ' ÷ 100). ' + comma(taken) + ' ' + r.unit + ' are ' + VERB[r.unit] + ', which is ' + (taken < yld ? 'LESS than' : taken > yld ? 'MORE than' : 'EXACTLY') + ' that.';
      };
      var order = shuffle([0, 1, 2, 3]);
      var options = order.map(function (i) { var text = GSS_TEXT[i]; return { text: text, tag: text === correct ? null : tag, msg: text === correct ? '' : msgFor(text) }; });
      var ci = options.map(function (o) { return o.tag === null; }).indexOf(true);
      return Q(hard ? 'hard' : 'gss', 'gss', { prompt: comma(stock) + ' ' + r.unit + ' of ' + r.name.replace('a ', '') + ', growing by ' + rate + '% a year. ' + comma(taken) + ' ' + r.unit + ' are ' + VERB[r.unit] + ' this year. Determine what happens to the stock.',
        stock: stock, rate: rate, taken: taken, yield: yld, unit: r.unit, options: options, correctIndex: ci,
        explain: ['Sustainable yield: ' + comma(stock) + ' × ' + rate + ' ÷ 100 = ' + comma(yld) + ' ' + r.unit + '.', comma(taken) + ' ' + r.unit + ' are ' + VERB[r.unit] + ', which is ' + (taken < yld ? 'less than the yield: the stock grows.' : taken > yld ? 'more than the yield: the stock shrinks.' : 'exactly the yield: the stock stays the same.')] });
    }

    /* ---------------- Round 3: management method ---------------- */
    function methodQ() {
      var sc = pick(METHOD_SCENARIOS);
      var options = sc.options.map(function (o) { return { text: o, tag: o === sc.correct ? null : 'method', msg: o === sc.correct ? '' : (sc.msgFor[o] || 'That is not the best method for this situation.') }; });
      var order = shuffle(options);
      var ci = order.map(function (o) { return o.tag === null; }).indexOf(true);
      return Q('hard', 'method', { prompt: sc.text + ' Choose the management method that best fits this situation.', scenario: sc.text, options: order, correctIndex: ci,
        explain: [sc.correct + ' is the best fit for this situation.'] });
    }

    /* pool item A: years until a stock run at a steady net loss reaches zero */
    function poolYears() {
      var r = pick(RESOURCES);
      var years = pick([4, 5, 6, 8, 10, 12, 15, 20]);
      var loss = pick([2, 3, 4, 5]) * 1000;
      var stock = loss * years;
      var options = [stock / loss, (stock / loss) * 2, stock / loss - 2, loss].map(function (v) { return Math.round(v); });
      var seen = {}; options = options.filter(function (v) { if (seen[v]) return false; seen[v] = 1; return true; });
      while (options.length < 4) options.push(years + options.length * 3);
      var opts = shuffle(options).map(function (v) { return { text: v + ' years', tag: v === years ? null : 'years', msg: v === years ? '' : 'Divide the stock by the net loss PER YEAR: ' + comma(stock) + ' ÷ ' + comma(loss) + '.' }; });
      var ci = opts.map(function (o) { return o.tag === null; }).indexOf(true);
      return Q('hard', 'poolYears', { prompt: comma(stock) + ' ' + r.unit + ' of ' + r.name.replace('a ', '') + ' are being ' + VERB[r.unit] + ' at a steady ' + comma(loss) + ' ' + r.unit + ' a year more than the sustainable yield. Calculate how many years it would take to reach zero, if this continues.',
        stock: stock, loss: loss, unit: r.unit, options: opts, correctIndex: ci,
        explain: [comma(stock) + ' ÷ ' + comma(loss) + ' = ' + years + ' years.'] });
    }

    var r1 = [yieldQ(), yieldQ(), yieldQ(), yieldQ(), yieldQ(), yieldQ()];
    var cats2 = shuffle(['grows', 'grows', 'shrinks', 'shrinks', 'equal', 'equal']);
    var r2 = cats2.map(function (c) { return gssQ(c, false); });
    var cats3 = shuffle(['grows', 'shrinks']);
    var r3fixed = cats3.map(function (c) { return gssQ(c, true); }).concat([methodQ(), methodQ()]);
    r3fixed = shuffle(r3fixed);
    var Q17 = rnd() < 0.5 ? poolYears() : methodQ();
    var Q18 = Q17.kind === 'poolYears' ? methodQ() : poolYears();

    var out = r1.concat(r2, r3fixed, [Q17, Q18]);
    out.forEach(function (q, i) { q.round = Math.floor(i / 6) + 1; q.n = (i % 6) + 1; });
    out.forEach(function (q) { q.cat = q.round === 1 ? 'yield' : q.round === 2 ? 'gss' : 'hard'; });
    return out;
  }

  /* ================================================================== *
   * THE GAME
   * ================================================================== */
  var ROUND_NAMES = ['Find the sustainable amount', 'Grows, shrinks, or stays the same?', 'Harder management'];
  var CATS = { yield: 'Sustainable yield', gss: 'Grows, shrinks, or stays the same', hard: 'Harder management' };
  var HABIT = {
    yield: 'Multiply the stock by the growth rate as a percentage: stock × rate ÷ 100.',
    below: 'Work out the sustainable yield first, then compare what was actually taken to it.',
    above: 'Work out the sustainable yield first, then compare what was actually taken to it.',
    equal: 'Work out the sustainable yield first, then compare what was actually taken to it.',
    method: 'Match the management method to the kind of resource: quotas and closed seasons for animals that breed, replanting for forests, recycling for materials that do not regrow, breeding programmes for populations that have fallen very low.',
    years: 'Divide the stock by the net loss PER YEAR, not the total amount taken.',
    other: 'Read the question again, and check the working below.'
  };
  var GENERIC = 'Read the question again, and check the working below.';

  var app = document.getElementById('app');
  var state, locked, roundStart, qStart;
  function fromHash() { var h = (location.hash || '').replace('#', '').toUpperCase(); return validCode(h) ? h : null; }
  function fresh(code) { var c = code || newCode(); state = { code: c, qs: generate(c), r: 0, i: 0, results: [], screen: 'start' }; locked = false; }
  function idx() { return state.r * 6 + state.i; }
  function q() { return state.qs[idx()]; }
  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function clear() { app.innerHTML = ''; }
  var esc = function (s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); };

  function display(Q) { return Q.prompt + ' | ' + Q.options.map(function (o) { return o.text; }).join(' / '); }
  function shortText(Q) { return Q.prompt; }

  /* ---------- screens ---------- */
  function start() {
    clear(); state.screen = 'start';
    var card = el('div', 'card');
    card.appendChild(el('h1', null, 'Sustainable Yield'));
    card.appendChild(el('p', 'lead', 'Every question gives you a resource, its growth rate, and sometimes how much is being taken. Work out the sustainable amount, or what happens to the stock.'));
    card.appendChild(el('p', 'lead', 'Three rounds of six questions. Each round is harder than the one before. Round 3 goes past the lesson: the last two questions are drawn from a hard pool. Do what you can and read the working.'));
    card.appendChild(el('p', 'lead', 'A wrong answer tells you what the mistake probably was. There is no timer on the questions. You can stop and see your results at any time.'));
    card.appendChild(el('p', 'small', 'Your questions are different from everyone else’s. Game code <span class="code" id="code">' + state.code + '</span>'));
    app.appendChild(card);
    var b = el('button', 'btn', 'Start round 1'); b.id = 'start'; b.onclick = beginRound; app.appendChild(b); b.focus();
  }
  function beginRound() { state.i = 0; roundStart = Date.now(); question(); }
  function header() {
    var h = el('header');
    h.appendChild(el('span', 'pill' + (state.r === 2 ? ' hard' : ''), 'Round ' + (state.r + 1) + ' · ' + ROUND_NAMES[state.r]));
    var d = el('div', 'dots'); d.setAttribute('aria-label', 'Question ' + (state.i + 1) + ' of 6');
    for (var k = 0; k < 6; k++) { var res = state.results[state.r * 6 + k]; d.appendChild(el('span', 'dot' + (res ? (res.ok ? ' right' : ' wrong') : (k === state.i ? ' now' : '')))); }
    h.appendChild(d); return h;
  }
  var LETTERS = ['A', 'B', 'C', 'D'];
  function question() {
    clear(); state.screen = 'question'; locked = false; qStart = Date.now();
    var Q = q();
    app.appendChild(header());
    var card = el('div', 'card'); card.id = 'qcard';
    card.innerHTML = '<p class="ask">' + esc(Q.prompt) + '</p>';
    card.setAttribute('data-display', display(Q));
    app.appendChild(card);
    var opts = el('div', 'opts'); opts.id = 'opts';
    Q.options.forEach(function (o, k) {
      var b = el('button', 'opt', '<b>' + LETTERS[k] + '</b><span>' + esc(o.text) + '</span>');
      b.type = 'button'; b.dataset.o = String(k + 1); b.setAttribute('aria-label', 'Option ' + LETTERS[k] + ': ' + o.text);
      b.onclick = function () { pressOpt(k); }; opts.appendChild(b);
    });
    app.appendChild(opts);
    var fb = el('div', 'hide'); fb.id = 'feedback'; app.appendChild(fb);
    var go = el('button', 'btn hide', 'Next'); go.id = 'nextbtn'; go.type = 'button'; go.onclick = next; app.appendChild(go);
    var stop = el('button', 'btn ghost small', 'Stop and see my results'); stop.id = 'stop'; stop.type = 'button'; stop.style.marginTop = '14px'; stop.onclick = final; app.appendChild(stop);
  }
  function pressOpt(k) { if (state.screen !== 'question' || locked) return; check(k); }

  function workHtml(Q) {
    var expl = (Q.explain || []).map(function (l) { return '<div>' + esc(l) + '</div>'; }).join('');
    return expl ? '<p class="how">Working:</p><div class="work">' + expl + '</div>' : '';
  }
  function correctText(Q) { return Q.options[Q.correctIndex].text; }
  function check(picked) {
    var Q = q(), ok = picked === Q.correctIndex, wrote = Q.options[picked].text, tag = null, msg = '';
    if (!ok) { tag = Q.options[picked].tag || 'other'; msg = Q.options[picked].msg || GENERIC; }
    var head = ok ? 'Correct.' : 'Not quite. The answer is: ' + Q.options[Q.correctIndex].text;
    document.querySelectorAll('.opt').forEach(function (b, k) { b.disabled = true; if (k === Q.correctIndex) b.classList.add('correct'); else if (k === picked) b.classList.add('picked'); });
    state.results[idx()] = { ok: ok, tag: tag, cat: Q.cat, secs: Math.max(1, Math.round((Date.now() - qStart) / 1000)), wrote: wrote };
    locked = true;
    var fb = document.getElementById('feedback'); fb.className = ok ? 'right' : 'wrong';
    fb.innerHTML = '<div class="head">' + esc(head) + '</div>' + (msg ? '<div class="msg">' + esc(msg) + '</div>' : '') + workHtml(Q);
    var last = state.i === 5, label = last ? (state.r === 2 ? 'See results' : 'Finish round') : 'Next';
    document.getElementById('nextbtn').textContent = label; document.getElementById('nextbtn').classList.remove('hide');
    document.querySelectorAll('.dot')[state.i].className = 'dot ' + (ok ? 'right' : 'wrong');
    fb.scrollIntoView({ block: 'nearest' });
  }
  function next() { if (state.i < 5) { state.i++; question(); } else roundEnd(); }

  /* ---------- the review: a drop-down per round; time, right or wrong, what was written and how to get there ---------- */
  function fmtTime(secs) { return secs < 60 ? secs + ' s' : Math.floor(secs / 60) + ' min ' + (secs % 60) + ' s'; }
  function reviewItem(r, k) {
    var Q = state.qs[r * 6 + k], x = state.results[r * 6 + k], n = r * 6 + k + 1;
    var h = '<div class="rq" data-q="' + n + '"><div class="top"><span class="qn">Question ' + n + '</span>';
    if (!x) return h + '<span class="verdict na">Not reached</span></div><div class="txt">' + esc(shortText(Q)) + '</div></div>';
    h += '<span class="meta">' + fmtTime(x.secs) + '</span></div><div class="txt">' + esc(shortText(Q)) + '</div>';
    if (x.ok) return h + '<div class="verdict ok">Correct</div></div>';
    h += '<div class="verdict no">Wrong</div><div class="wrote">You wrote <b>' + esc(x.wrote) + '</b>. The answer is <b>' + esc(correctText(Q)) + '</b>.</div><p class="how">How to get there:</p>' + workHtml(Q);
    return h + '</div>';
  }
  function reviewHtml(r, open) {
    var mine = state.results.slice(r * 6, r * 6 + 6), done = mine.filter(function (x) { return x; }), right = done.filter(function (x) { return x.ok; }).length;
    var secs = done.reduce(function (a, x) { return a + x.secs; }, 0);
    var sum = 'Round ' + (r + 1) + ' · ' + ROUND_NAMES[r] + ' · ' + right + ' of ' + (done.length === 6 ? 6 : done.length + ' answered') + (done.length ? ' · ' + fmtTime(secs) : '');
    var body = ''; for (var k = 0; k < 6; k++) body += reviewItem(r, k);
    return '<details class="review" data-round="' + (r + 1) + '"' + (open ? ' open' : '') + '><summary><span>' + sum + '</span></summary>' + body + '</details>';
  }
  function roundEnd() {
    clear(); state.screen = 'round';
    var mine = state.results.slice(state.r * 6, state.r * 6 + 6), right = mine.filter(function (x) { return x && x.ok; }).length, secs = Math.round((Date.now() - roundStart) / 1000);
    var card = el('div', 'card');
    card.appendChild(el('h2', null, 'Round ' + (state.r + 1) + ' done'));
    card.appendChild(el('div', 'score', right + ' of 6'));
    card.appendChild(el('p', 'small', 'Round time ' + Math.floor(secs / 60) + ' min ' + (secs % 60) + ' s. The time does not count for anything.'));
    card.appendChild(el('p', 'small', 'Open the summary to see how long each question took, and how to get to the answer for any you missed.'));
    card.insertAdjacentHTML('beforeend', reviewHtml(state.r, false));
    app.appendChild(card);
    var b = el('button', 'btn', state.r < 2 ? 'Start round ' + (state.r + 2) : 'See what to practise'); b.id = 'roundnext';
    b.onclick = function () { if (state.r < 2) { state.r++; beginRound(); } else final(); }; app.appendChild(b); b.focus();
  }
  function final() {
    clear(); state.screen = 'final';
    var done = state.results.filter(function (x) { return x; }), total = done.filter(function (x) { return x.ok; }).length;
    var card = el('div', 'card'); card.appendChild(el('h2', null, 'What to practise')); card.appendChild(el('div', 'score', total + ' of 18'));
    if (done.length < 18) card.appendChild(el('p', 'small', done.length + ' of 18 questions answered.'));
    Object.keys(CATS).forEach(function (c) {
      var all = state.qs.filter(function (Q) { return Q.cat === c; }).length, rs = done.filter(function (x) { return x.cat === c; }), ok = rs.filter(function (x) { return x.ok; }).length;
      card.appendChild(el('div', 'row', '<span><b>' + CATS[c] + '</b><br><span class="small">' + ok + ' of ' + all + (rs.length < all ? ' (' + (all - rs.length) + ' not reached)' : '') + '</span></span><span class="bar" aria-hidden="true"><i style="width:' + Math.round(100 * ok / all) + '%"></i></span>'));
    });
    app.appendChild(card);
    var rev = el('div', 'card'); rev.appendChild(el('h2', null, 'Every question'));
    rev.appendChild(el('p', 'small', 'Open a round to see the time for each question, what you wrote and how to get to each right answer.'));
    for (var rr = 0; rr < 3; rr++) rev.insertAdjacentHTML('beforeend', reviewHtml(rr, false));
    app.appendChild(rev);
    var tips = el('div', 'card'); tips.appendChild(el('h2', null, 'Your mistakes'));
    var counts = {}; done.forEach(function (x) { if (!x.ok) counts[x.tag] = (counts[x.tag] || 0) + 1; });
    var tags = Object.keys(counts);
    if (!tags.length) tips.appendChild(el('p', 'lead', done.length ? 'No mistakes. Every answer you gave was right.' : 'You did not answer any questions.'));
    else { var ul = el('ul', 'tips'); tags.forEach(function (t) { var n = counts[t]; ul.appendChild(el('li', null, '<b>' + n + (n === 1 ? ' time. ' : ' times. ') + '</b>' + esc(HABIT[t] || GENERIC))); }); tips.appendChild(ul); }
    tips.appendChild(el('p', 'small', 'Game code <span class="code">' + state.code + '</span>. Your teacher can open this file with #' + state.code + ' on the end of the address to see the same questions.'));
    app.appendChild(tips);
    var b = el('button', 'btn ghost', 'Play again'); b.id = 'again'; b.onclick = function () { fresh(); start(); }; app.appendChild(b); b.focus();
  }
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey || state.screen !== 'question') return;
    if (/^[1-4]$/.test(e.key) && !locked) { e.preventDefault(); pressOpt(parseInt(e.key, 10) - 1); }
    else if (e.key === 'Enter' && locked) { e.preventDefault(); next(); }
  });
  window.__game = { generate: generate, newCode: newCode, questions: function () { return state.qs; }, code: function () { return state.code; }, display: display };
  fresh(fromHash()); start();
})();
</script>
</body>
</html>
