<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earth Resources revision</title>
<style>
  :root {
    --earth: #3D2B1F; --gold: #C99A3D; --goldink: #8F6D2A; --slate: #6A8C9A; --terra: #B5482E; --sand: #F2EBDD; --sand2: #E4D8BE;
    --ink: #2A1D14; --soft: #6B5A48; --green: #1F7A48; --white: #fff; --amber: #B8860B;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--sand); color: var(--ink); font-family: Arial, Helvetica, sans-serif; -webkit-text-size-adjust: 100%; }
  body { min-height: 100vh; display: flex; justify-content: center; }
  #app { width: 100%; max-width: 840px; padding: 14px 16px 36px; }
  h1, h2 { font-family: Georgia, 'Times New Roman', serif; color: var(--earth); margin: 0 0 8px; }
  h3 { font-family: Georgia, 'Times New Roman', serif; color: var(--earth); margin: 14px 0 6px; font-size: 18px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .pill { background: var(--earth); color: var(--white); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; border-radius: 999px; padding: 7px 14px; white-space: nowrap; }
  .pill.hard { background: var(--terra); }
  .clock { font-size: 13px; color: var(--soft); white-space: nowrap; }
  .dots { display: flex; gap: 5px; flex-wrap: wrap; }
  .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--earth); background: var(--white); }
  .dot.now { background: var(--sand2); } .dot.right { background: var(--green); border-color: var(--green); } .dot.wrong { background: var(--terra); border-color: var(--terra); } .dot.part { background: var(--gold); border-color: var(--goldink); }
  .topic { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--goldink); margin: 0 0 6px; }
  .card { background: var(--white); border: 2px solid var(--sand2); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .ask { font-size: 19px; color: var(--earth); font-weight: 700; margin: 0 0 12px; line-height: 1.38; }
  .sub { font-size: 15px; color: var(--soft); margin: 8px 0 0; line-height: 1.4; }
  .hint { font-size: 14px; color: var(--soft); margin: 0 0 10px; }
  button { font: inherit; cursor: pointer; }
  .btn { padding: 15px 26px; border-radius: 12px; font-size: 18px; font-weight: 700; min-height: 54px; touch-action: manipulation; background: var(--earth); color: var(--white); border: 2px solid var(--earth); }
  .btn.ghost { background: var(--white); color: var(--earth); } .btn.small { padding: 8px 14px; font-size: 14px; min-height: 44px; }
  .btn.gold { background: var(--gold); border-color: var(--goldink); color: var(--earth); }
  button:disabled { opacity: .45; cursor: default; }
  .opt:disabled, .chip:disabled, .oitem:disabled { opacity: 1; }
  button:focus-visible, summary:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .btnrow { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
  .opts { display: grid; gap: 10px; margin-bottom: 12px; }
  .opt { display: flex; align-items: center; gap: 12px; text-align: left; min-height: 58px; padding: 8px 14px; background: var(--white); border: 2px solid var(--sand2); border-radius: 12px; font-size: 16.5px; font-weight: 700; color: var(--earth); touch-action: manipulation; line-height: 1.3; }
  .opt b { width: 32px; height: 32px; border-radius: 50%; background: var(--sand2); display: flex; align-items: center; justify-content: center; font-size: 16px; flex: none; }
  .opt.correct { border-color: var(--green); background: #EAF6EF; } .opt.picked { border-color: var(--terra); background: #FBEAE6; }
  .chips { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 12px; }
  .chip { min-height: 56px; padding: 8px 12px; border: 2px solid var(--sand2); border-radius: 12px; background: var(--white); font-size: 16.5px; font-weight: 700; color: var(--earth); touch-action: manipulation; }
  .chip.on { border-color: var(--goldink); background: #FBF1D9; }
  .chip.good { border-color: var(--green); background: #EAF6EF; } .chip.bad { border-color: var(--terra); background: #FBEAE6; } .chip.miss { border-color: var(--green); border-style: dashed; background: #fff; }
  .order { display: grid; gap: 10px; margin-bottom: 12px; }
  .oitem { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 14px; border: 2px solid var(--sand2); border-radius: 12px; background: var(--white); font-size: 16.5px; font-weight: 700; color: var(--earth); text-align: left; touch-action: manipulation; }
  .oitem b { width: 32px; height: 32px; border-radius: 50%; border: 2px dashed var(--soft); display: flex; align-items: center; justify-content: center; flex: none; font-size: 16px; color: var(--soft); }
  .oitem.placed { border-color: var(--goldink); background: #FBF1D9; } .oitem.placed b { border: 0; background: var(--earth); color: var(--white); }
  .oitem.good { border-color: var(--green); background: #EAF6EF; } .oitem.bad { border-color: var(--terra); background: #FBEAE6; }
  .arow { display: grid; grid-template-columns: 1fr; gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--sand2); }
  .arow:last-child { border-bottom: 0; }
  .arow .t { font-size: 16.5px; font-weight: 700; color: var(--earth); line-height: 1.35; }
  .arow.good { background: #EAF6EF; } .arow.bad { background: #FBEAE6; }
  .arow .say { font-size: 14.5px; color: var(--soft); }
  select, input[type=text], input[inputmode], textarea { font: inherit; font-size: 16px; padding: 10px 12px; border: 2px solid var(--sand2); border-radius: 10px; background: var(--white); color: var(--ink); width: 100%; }
  textarea { min-height: 130px; resize: vertical; line-height: 1.4; }
  .answerrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .answerrow input { width: 200px; font-size: 22px; font-weight: 700; } .answerrow .unit { font-size: 17px; color: var(--soft); font-weight: 700; }
  .ticks label { display: flex; gap: 12px; align-items: flex-start; padding: 10px 6px; border-bottom: 1px solid var(--sand2); font-size: 16px; line-height: 1.4; cursor: pointer; }
  .ticks label:last-child { border-bottom: 0; } .ticks input { width: 22px; height: 22px; margin-top: 1px; flex: none; accent-color: var(--green); }
  .model { background: #FBF1D9; border: 2px solid var(--goldink); border-radius: 12px; padding: 12px 14px; margin: 10px 0; font-size: 16px; line-height: 1.45; color: var(--earth); }
  #feedback { border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; border: 3px solid; }
  #feedback.right { border-color: var(--green); background: #EAF6EF; } #feedback.wrong { border-color: var(--terra); background: #FBEAE6; } #feedback.part { border-color: var(--goldink); background: #FBF1D9; }
  #feedback .head { font-size: 21px; font-weight: 700; margin-bottom: 6px; } #feedback.right .head { color: var(--green); } #feedback.wrong .head { color: var(--terra); } #feedback.part .head { color: var(--goldink); }
  #feedback .msg { font-size: 17px; font-weight: 700; color: var(--earth); margin-bottom: 8px; line-height: 1.4; }
  .how { font-size: 15px; color: var(--soft); margin: 8px 0 2px; }
  .work { font-size: 16.5px; color: var(--earth); font-weight: 700; line-height: 1.5; } .work div { margin: 2px 0; }
  .from { font-size: 13.5px; color: var(--soft); margin-top: 8px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--sand2); }
  .row:last-child { border-bottom: 0; }
  .bar { height: 12px; border-radius: 6px; background: var(--sand2); overflow: hidden; width: 140px; flex: none; } .bar i { display: block; height: 100%; background: var(--green); }
  .lead { font-size: 18px; line-height: 1.45; margin: 0 0 10px; } .small { font-size: 13px; color: var(--soft); }
  .score { font-size: 44px; font-family: Georgia, serif; font-weight: 700; color: var(--earth); }
  ul.tips { padding-left: 20px; margin: 8px 0 0; } ul.tips li { margin: 8px 0; font-size: 16.5px; line-height: 1.4; }
  .step { border-left: 5px solid var(--gold); padding: 6px 0 6px 14px; margin: 12px 0; }
  .step .nm { font-weight: 700; font-size: 17px; color: var(--earth); } .step div { font-size: 15.5px; line-height: 1.45; margin: 3px 0; }
  .code { font-family: 'Courier New', monospace; font-weight: 700; letter-spacing: .12em; color: var(--earth); }
  details.review { border: 2px solid var(--sand2); border-radius: 12px; background: var(--white); margin: 10px 0 0; }
  details.review > summary { cursor: pointer; padding: 12px 14px; font-weight: 700; color: var(--earth); font-size: 16px; line-height: 1.35; list-style: none; display: flex; justify-content: space-between; gap: 10px; align-items: center; min-height: 48px; }
  details.review > summary::-webkit-details-marker { display: none; } details.review > summary::after { content: '\25BE'; font-size: 18px; flex: none; }
  details.review[open] > summary::after { transform: rotate(180deg); }
  .rq { padding: 12px 14px; border-top: 1px solid var(--sand2); }
  .rq .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .rq .qn { font-weight: 700; color: var(--earth); font-size: 15px; } .rq .meta { font-size: 14px; color: var(--soft); white-space: nowrap; }
  .rq .verdict { font-weight: 700; font-size: 15px; } .verdict.ok { color: var(--green); } .verdict.no { color: var(--terra); } .verdict.na { color: var(--soft); } .verdict.pt { color: var(--goldink); }
  .rq .txt { font-size: 15px; line-height: 1.4; margin: 4px 0; } .rq .wrote { font-size: 15px; margin: 6px 0 2px; color: var(--earth); line-height: 1.4; }
  .rq .mine { font-size: 15px; background: var(--sand); border-radius: 8px; padding: 8px 10px; margin: 6px 0; white-space: pre-wrap; }
  .hide { display: none !important; }
  @media print { body { background: #fff; } .btn, #stop, .noprint { display: none !important; } details.review { break-inside: avoid; } }
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<script>
(function () {
  'use strict';

  /* ================================================================== *
   * EARTH RESOURCES REVISION. Nobody gets the same game.
   *
   * Five levels, 54 questions, built to last about an hour. Level 1 is the lessons; each level after it is harder; level 5 is past the test.
   * The questions come from a bank (BANK, written by build/earth-resources-bank.py) and from numeric templates (TPL, below). Each question slot
   * has a pool; a game code, different for every student, picks one item from each pool, shuffles the options and draws the numbers. Opening
   * the file with #CODE after the address gives the same game again. The SKILLS and their order are the same for everyone, so the
   * diagnostic at the end means the same thing for every student.
   *
   * Question kinds: mc (choose one), num (type a number), build (tap all that apply), assign (a menu for each row), order (tap in order),
   * written (type an answer, see a model answer, tick the mark points your answer made: honest self-marking, not auto-marking).
   * ================================================================== */
  var BANK = /*DATA*/null/*END*/;

  var ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  function newCode() {
    var out = '', bytes = new Uint8Array(6);
    if (window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(bytes);
    else for (var k = 0; k < 6; k++) bytes[k] = Math.floor(Math.random() * 256);
    for (var i = 0; i < 6; i++) out += ALPHABET[bytes[i] % ALPHABET.length];
    return out;
  }
  function validCode(c) { return typeof c === 'string' && /^[A-HJ-NP-Z2-9]{6}$/.test(c); }
  function makeRng(code) {
    var h = 1779033703 ^ code.length;
    for (var i = 0; i < code.length; i++) { h = Math.imul(h ^ code.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
    var a = (h ^ (h >>> 16)) >>> 0;
    return function () { a = (a + 0x6D2B79F5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function comma(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

  var RESOURCES = [
    { name: 'fish stock', unit: 'tonnes', verb: 'caught' }, { name: 'forest', unit: 'hectares', verb: 'cut' }, { name: 'deer herd', unit: 'deer', verb: 'hunted' },
    { name: 'seal colony', unit: 'seals', verb: 'taken' }, { name: 'timber plantation', unit: 'hectares', verb: 'cut' }, { name: 'lobster population', unit: 'tonnes', verb: 'caught' },
  ];
  var GSS_TEXT = ['This resource is being depleted', 'This resource is not being depleted; it stays the same', 'This resource is not being depleted; it is growing', 'There is not enough information to decide'];

  /* ================================================================== *
   * NUMERIC TEMPLATES. Each returns a question with the answer, the named mistakes (each with the sum that produces it) and the working.
   * Every value is a whole number, every mistake differs from the answer and from the other mistakes. build/check-earth-resources-game.py
   * re-derives all of it with sympy.
   * ================================================================== */
  function numQ(id, o) { o.kind = o.kind || 'num'; o.tpl = id; return o; }
  function mk(value, tag, msg, how) { return { value: value, tag: tag, msg: msg, how: how }; }

  var TPL = {
    time_form: function (c) {
      var R, n; do { R = c.pick([100, 150, 200, 250, 300]); n = c.pick([2, 3, 4]); } while (R * n > 1000);
      var ans = R * n;
      return numQ('time_form', { prompt: 'Suppose soil forms at 1 cm every ' + R + ' years. How many years would ' + n + ' cm take to form?', unit: 'years', answer: ans, params: { R: R, n: n },
        mistakes: [mk(R + n, 'time-calc-add', 'You added. To find the time for several centimetres, multiply.', R + ' + ' + n + ' = ' + (R + n)), mk(R, 'time-calc-one', 'That is the time for 1 cm. The question asks for ' + n + ' cm.', 'time for 1 cm = ' + R)],
        explain: [n + ' cm × ' + R + ' years for each cm = ' + comma(ans) + ' years.'] });
    },
    yield: function (c) {
      var r = c.pick(RESOURCES), S = c.pick([100000, 150000, 200000, 250000, 300000, 400000, 500000, 600000]), g = c.pick([2, 4, 5, 8]), Y = S * g / 100;
      return numQ('yield', { prompt: 'A ' + r.name + ' of ' + comma(S) + ' ' + r.unit + ' grows by ' + g + '% a year. Calculate the greatest amount that can be ' + r.verb + ' each year without shrinking it.', unit: r.unit, answer: Y, params: { S: S, rate: g, unit: r.unit },
        mistakes: [mk(S * g, 'yield-percent', 'The rate is a percentage, so divide by 100.', comma(S) + ' × ' + g + ' = ' + comma(S * g)), mk(S / g, 'yield-flip', 'You divided by the rate. Multiply by it, then divide by 100.', comma(S) + ' ÷ ' + g + ' = ' + comma(S / g))],
        explain: ['Sustainable yield = stock × rate ÷ 100.', comma(S) + ' × ' + g + ' ÷ 100 = ' + comma(Y) + ' ' + r.unit + '.'] });
    },
    pctpoints: function (c) {
      var ab = c.pick([[20, 25], [20, 30], [40, 50], [10, 15], [40, 60], [50, 60], [25, 30], [60, 75]]), a = ab[0], b = ab[1];
      var ctx = c.pick(['Farmland in a country grows', 'The share of a country covered by buildings and roads grows', 'The share of a country used for farming grows']);
      var rel = Math.round((b - a) * 100 / a);
      return numQ('pctpoints', { prompt: ctx + ' from ' + a + '% to ' + b + '% of its area. Calculate the increase, in percentage points.', unit: 'percentage points', answer: b - a, params: { a: a, b: b },
        mistakes: [mk(rel, 'pct-points', 'That is the percentage increase. Percentage POINTS are just the difference between the two percentages.', '(' + b + ' − ' + a + ') ÷ ' + a + ' × 100 = ' + rel)],
        explain: [b + ' − ' + a + ' = ' + (b - a) + ' percentage points.'] });
    },
    pctdec: function (c) {
      var S = c.pick([200000, 400000, 600000, 800000]), p = c.pick([20, 60, 75, 90]), nw = S * (100 - p) / 100;
      var wb = p * 100 / (100 - p);
      return numQ('pctdec', { prompt: 'A fish stock of ' + comma(S) + ' tonnes falls to ' + comma(nw) + ' tonnes. Calculate the percentage decrease.', unit: '%', answer: p, params: { S: S, now: nw },
        mistakes: [mk(wb, 'pct-wrong-base', 'You divided by the NEW amount. Divide the change by the amount you started with.', comma(S - nw) + ' ÷ ' + comma(nw) + ' × 100 = ' + wb), mk(100 - p, 'pct-left', 'That is the percentage that is LEFT. The question asks for the percentage lost.', '100 − ' + p + ' = ' + (100 - p))],
        explain: ['Change = ' + comma(S) + ' − ' + comma(nw) + ' = ' + comma(S - nw) + '.', 'Percentage decrease = ' + comma(S - nw) + ' ÷ ' + comma(S) + ' × 100 = ' + p + '%.'] });
    },
    decline2: function (c) {
      var r = c.pick(RESOURCES), S = c.pick([40000, 80000, 120000, 160000, 200000, 240000, 280000, 320000]), end = S / 4;
      return numQ('decline2', { prompt: 'A ' + r.name + ' starts at ' + comma(S) + ' ' + r.unit + '. It loses half of what is left every year. Calculate how much is left after 2 years.', unit: r.unit, answer: end, params: { S: S, n: 2, unit: r.unit },
        mistakes: [mk(S / 2, 'decline-stop', 'That is after only 1 year. Halve again for the second year.', comma(S) + ' ÷ 2 = ' + comma(S / 2)), mk(S * 3 / 4, 'decline-lost', 'That is how much was LOST. The question asks how much is left.', comma(S) + ' − ' + comma(end) + ' = ' + comma(S * 3 / 4))],
        explain: ['Year 1: ' + comma(S) + ' ÷ 2 = ' + comma(S / 2) + '.', 'Year 2: ' + comma(S / 2) + ' ÷ 2 = ' + comma(end) + ' ' + r.unit + ' left.'] });
    },
    yield_left: function (c) {
      var r = c.pick(RESOURCES), S = c.pick([200000, 250000, 300000, 400000, 500000]), g = c.pick([4, 5, 8]), Y = S * g / 100, k = c.pick([1000, 2000, 3000]), taken = Y - k;
      return numQ('yield_left', { prompt: 'A ' + r.name + ' of ' + comma(S) + ' ' + r.unit + ' grows by ' + g + '% a year. This year ' + comma(taken) + ' ' + r.unit + ' have been ' + r.verb + '. How many more ' + r.unit + ' could be ' + r.verb + ' this year without shrinking it?', unit: r.unit, answer: k, params: { S: S, rate: g, taken: taken, unit: r.unit },
        mistakes: [mk(Y, 'yield-compare', 'That is the whole sustainable yield. Some of it has already been taken.', comma(S) + ' × ' + g + ' ÷ 100 = ' + comma(Y)), mk(taken, 'yield-compare', 'That is what has been taken already. Compare it with the sustainable yield.', 'amount taken = ' + comma(taken))],
        explain: ['Sustainable yield = ' + comma(S) + ' × ' + g + ' ÷ 100 = ' + comma(Y) + ' ' + r.unit + '.', 'Already ' + r.verb + ': ' + comma(taken) + '. So ' + comma(Y) + ' − ' + comma(taken) + ' = ' + comma(k) + ' ' + r.unit + ' more.'] });
    },
    decline3: function (c) {
      var r = c.pick(RESOURCES), S = c.pick([80000, 160000, 240000, 320000, 400000, 480000]), end = S / 8;
      return numQ('decline3', { prompt: 'A ' + r.name + ' starts at ' + comma(S) + ' ' + r.unit + '. It loses half of what is left every year. Calculate how much is left after 3 years.', unit: r.unit, answer: end, params: { S: S, n: 3, unit: r.unit },
        mistakes: [mk(S / 4, 'decline-stop', 'That is after only 2 years. Halve once more.', comma(S) + ' ÷ 4 = ' + comma(S / 4)), mk(S / 16, 'decline-extra', 'That is after 4 years. Stop after 3.', comma(S) + ' ÷ 16 = ' + comma(S / 16)), mk(S - end, 'decline-lost', 'That is how much was LOST. The question asks how much is left.', comma(S) + ' − ' + comma(end) + ' = ' + comma(S - end))],
        explain: ['Year 1: ' + comma(S) + ' ÷ 2 = ' + comma(S / 2) + '.', 'Year 2: ' + comma(S / 2) + ' ÷ 2 = ' + comma(S / 4) + '.', 'Year 3: ' + comma(S / 4) + ' ÷ 2 = ' + comma(end) + ' ' + r.unit + ' left.'] });
    },
    cover_area: function (c) {
      var A = c.pick([2000, 2400, 3000, 4000]), p = c.pick([25, 35, 45, 60]), ans = A * p / 100;
      return numQ('cover_area', { prompt: 'A city covers ' + comma(A) + ' hectares of land. Buildings, roads and car parks seal ' + p + '% of it. How many hectares are sealed?', unit: 'hectares', answer: ans, params: { A: A, p: p },
        mistakes: [mk(A - ans, 'cover-left', 'That is the area that is NOT sealed. The question asks for the sealed area.', comma(A) + ' − ' + comma(ans) + ' = ' + comma(A - ans)), mk(A * p, 'pct-forgot100', 'The percentage needs dividing by 100.', comma(A) + ' × ' + p + ' = ' + comma(A * p))],
        explain: [comma(A) + ' × ' + p + ' ÷ 100 = ' + comma(ans) + ' hectares are sealed.'] });
    },
    gss: function (c) {
      var r = c.pick(RESOURCES), S = c.pick([80000, 100000, 120000, 150000, 180000, 200000]), g = c.pick([4, 5, 8, 10]), Y = S * g / 100, cat = c.pick(['depleted', 'same', 'growing']), k = c.pick([500, 1000, 1500, 2000]);
      var taken = cat === 'depleted' ? Y + k : cat === 'same' ? Y : Y - k;
      var correct = cat === 'depleted' ? GSS_TEXT[0] : cat === 'same' ? GSS_TEXT[1] : GSS_TEXT[2];
      var rel = taken > Y ? 'MORE than' : taken < Y ? 'LESS than' : 'EXACTLY';
      var opts = c.shuffle(GSS_TEXT).map(function (t) {
        return { text: t, tag: t === correct ? null : 'yield-compare', msg: t === correct ? '' : (t === GSS_TEXT[3] ? 'The sustainable yield is ' + comma(Y) + ' ' + r.unit + ', and ' + comma(taken) + ' are ' + r.verb + '. That is enough to decide.' : 'The sustainable yield is ' + comma(Y) + ' ' + r.unit + '. ' + comma(taken) + ' are ' + r.verb + ', which is ' + rel + ' that.') };
      });
      return numQ('gss', { kind: 'mc', prompt: 'A ' + r.name + ' of ' + comma(S) + ' ' + r.unit + ' grows by ' + g + '% a year. This year ' + comma(taken) + ' ' + r.unit + ' are ' + r.verb + '. Decide what is happening to it.', options: opts, correctIndex: opts.map(function (o) { return o.tag === null; }).indexOf(true),
        params: { S: S, rate: g, taken: taken, cat: cat },
        explain: ['Sustainable yield: ' + comma(S) + ' × ' + g + ' ÷ 100 = ' + comma(Y) + ' ' + r.unit + '.', comma(taken) + ' ' + r.unit + ' are ' + r.verb + ', which is ' + (taken > Y ? 'more than the yield: it is being depleted.' : taken < Y ? 'less than the yield: it is growing.' : 'exactly the yield: it stays the same.')] });
    },
    decline_third2: function (c) {

    if (missed.length) { tips.appendChild(el('h3', null, 'Points you left out of written answers')); var ul2 = el('ul', 'tips'); missed.slice(0, 8).forEach(function (m) { ul2.appendChild(el('li', null, esc(m))); }); tips.appendChild(ul2); }
    app.appendChild(tips);

    var rev = el('div', 'card'); rev.appendChild(el('h2', null, 'Every question'));
    rev.appendChild(el('p', 'small', 'Open a level to see the time for each question, what you wrote and how to get to each right answer.'));
    for (var lv = 0; lv < NLEV; lv++) rev.insertAdjacentHTML('beforeend', reviewHtml(lv, false));
    app.appendChild(rev);
    app.appendChild(el('p', 'small', 'Game code <span class="code">' + state.code + '</span>. Your teacher can open this file with #' + state.code + ' on the end of the address to see the same questions.'));
    var row = el('div', 'btnrow noprint');
    var p = el('button', 'btn gold', 'Print or save my plan'); p.id = 'print'; p.type = 'button'; p.onclick = function () { document.querySelectorAll('details.review').forEach(function (d) { d.open = true; }); window.print(); }; row.appendChild(p);
    var b = el('button', 'btn ghost', 'Play again with new questions'); b.id = 'again'; b.type = 'button'; b.onclick = function () { fresh(); start(); }; row.appendChild(b);
    app.appendChild(row); b.focus();
  }

  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey || state.screen !== 'question') return;
    var Q = q(), tag = (document.activeElement && document.activeElement.tagName) || '';
    if (Q.kind === 'mc' && /^[1-4]$/.test(e.key) && !locked) { e.preventDefault(); KIND.mc.pick(parseInt(e.key, 10) - 1); }
    else if (e.key === 'Enter' && locked && tag !== 'TEXTAREA') { e.preventDefault(); next(); }
  });
  window.__game = { generate: generate, newCode: newCode, questions: function () { return state.qs; }, code: function () { return state.code; }, display: display, bank: function () { return BANK; }, parseNum: parseNum, sizes: SIZES };
  fresh(fromHash()); start();
})();
</script>
